<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breakthrough application · Colour Me Neurospicy</title>
<meta name="description" content="Apply for the Breakthrough program: the community program, the intimate group program or 1:1 with Sav.">
<meta name="theme-color" content="#4E0C08">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Playfair+Display:ital,wght@0,700;0,800;1,800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#4E0C08;--m2:#2A0806;--cr:#FFF4EE;--lime:#F1F9A6;--pink:#F4C2F7;--hot:#E8338A;--red:#B5281E;--ink:#1F1412;--soft:#F3DCD6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--m);color:var(--cr);font-family:Poppins,system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-left)) 10px}
.top img{width:34px;height:34px;border-radius:9px}
.top b{font-family:'Patrick Hand SC',cursive;font-weight:400;font-size:19px;letter-spacing:2px;color:var(--lime)}
.bar{height:8px;margin:0 max(16px,env(safe-area-inset-left));background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:8px;transition:width .4s}
.step-n{margin:8px max(16px,env(safe-area-inset-left)) 0;font-family:'Patrick Hand SC',cursive;letter-spacing:1.5px;color:var(--pink);font-size:15px}
main{flex:1;display:flex;justify-content:center;padding:18px max(16px,env(safe-area-inset-left)) 40px}
.card{width:100%;max-width:620px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
.kick{font-family:'Patrick Hand SC',cursive;font-size:20px;letter-spacing:2px;color:var(--pink);margin:0 0 6px}
h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.08;margin:0 0 14px}
h1 em{font-style:italic;color:var(--lime)}
h2{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(24px,5.5vw,32px);line-height:1.15;margin:0 0 10px}
p{line-height:1.6;color:var(--soft);margin:0 0 14px}
.note{font-size:14px;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
label.q{display:block;font-weight:600;margin:18px 0 8px;color:var(--cr)}
label.q small{display:block;font-weight:400;color:#D9B9B2;font-size:13px;margin-top:2px}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--cr);border:2px solid var(--ink);border-radius:14px;padding:13px 14px}
textarea{min-height:130px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:3px solid var(--lime);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--cr);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s}
.opt:hover{transform:translateY(-2px)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;font-weight:700}
.opt.radio .box{border-radius:50%}
.opt:has(input:checked){background:var(--lime);box-shadow:4px 4px 0 var(--ink)}
.opt:has(input:checked) .box{background:var(--ink);color:var(--lime)}
.opt:has(input:checked) .box::after{content:'✓'}
.opt:has(input:focus-visible){outline:3px solid var(--pink);outline-offset:2px}
.opt b{display:block;font-size:16px}
.opt span.d{font-size:13.5px;color:#5A4A47;line-height:1.45}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:26px}
.btn{font:600 17px Poppins,sans-serif;border:2px solid var(--ink);border-radius:999px;padding:14px 28px;cursor:pointer;background:var(--lime);color:var(--m2)}
.btn:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--cr);border-color:rgba(255,255,255,.35)}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:#FFB4A8;font-size:14px;margin:10px 0 0;min-height:1em}
.perks{display:grid;gap:8px;margin:16px 0}
.perks div{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.perks b{color:var(--lime)}
.big-emoji{font-size:44px;margin-bottom:6px}
.next{background:var(--cr);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:16px 18px;margin:12px 0}
.next h3{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:20px}
.next p{color:#4A3A38;margin:0;font-size:15px}
.links a{display:inline-block;margin:6px 8px 0 0;color:var(--m2);background:var(--lime);border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;text-decoration:none;font-size:14px}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="top"><img src="/icons/icon-192.png" alt=""><b>Colour Me Neurospicy</b></div>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<p class="step-n" id="stepn" aria-live="polite"></p>
<main><form class="card" id="card" novalidate></form></main>
<script src="/js/apply.js"></script>
</body>
</html>
