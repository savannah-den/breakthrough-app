<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Email preview</title>
<link rel="icon" href="icons/favicon-32.png">
<style>body{margin:0;background:#2A0806;font-family:Poppins,Arial,sans-serif}.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#1F1412;position:sticky;top:0;z-index:2}.bar button{border:2px solid #1F1412;border-radius:999px;padding:8px 16px;font:600 14px Poppins,Arial,sans-serif;background:#FFF4EE;color:#1F1412;cursor:pointer}.bar button.on{background:#F1F9A6}.sub{color:#F3DCD6;text-align:center;font-size:13px;padding:10px 12px 0}iframe{display:block;width:100%;max-width:680px;margin:0 auto;border:0;height:2400px;background:#3A0E0C}</style></head>
<body>
<div class="bar" role="tablist"><button data-k="welcome" class="on">Welcome (1:1)</button><button data-k="self">Welcome (self-paced)</button><button data-k="r24">Call reminder: 24 hours</button><button data-k="r2">Call reminder: 2 hours</button><button data-k="r15">Call reminder: 15 minutes</button><button data-k="g2">Group call: 2 hours</button></div>
<p class="sub" id="subj"></p>
<iframe id="f" title="Email preview"></iframe>
<script src="js/emails.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), first = q.get('n') || 'Karen', site = location.origin.indexOf('http') === 0 ? location.origin : 'https://app.colourmeneurospicy.com.au';
  var rel = location.protocol === 'file:' || /claudeusercontent|claude\.ai/.test(location.host);
  var img = function (n) { return n === 'logo' ? (rel ? 'icons/icon-192.png' : site + '/icons/icon-192.png') : (rel ? 'img/email/' : site + '/img/email/') + n + (/^icons\//.test(n) ? '.png' : '.jpg'); };
  var t = new Date(Date.now() + 26 * 3600e3); t.setMinutes(0, 0, 0);
  var zoom = 'https://us06web.zoom.us/j/81234567890?pwd=example';
  var make = {
    welcome: function () { return BT_EMAILS.welcomeEmail({ first: first, img: img, site: site }); },
    self: function () { return BT_EMAILS.welcomeSelfEmail({ first: first, img: img, site: site, tier: 'self' }); },
    r24: function () { return BT_EMAILS.reminderEmail({ first: first, kind: '1:1', lead: '24h', start: t.toISOString(), zoom: zoom, img: img, site: site }); },
    r2: function () { return BT_EMAILS.reminderEmail({ first: first, kind: '1:1', lead: '2h', start: t.toISOString(), zoom: zoom, img: img, site: site }); },
    r15: function () { return BT_EMAILS.reminderEmail({ first: first, kind: '1:1', lead: '15m', start: t.toISOString(), zoom: zoom, img: img, site: site }); },
    g2: function () { return BT_EMAILS.reminderEmail({ first: first, kind: 'Group', lead: '2h', start: t.toISOString(), zoom: zoom, img: img, site: site }); }
  };
  function show(k) {
    document.querySelectorAll('.bar button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); b.setAttribute('aria-selected', b.dataset.k === k); });
    var m = make[k](); document.getElementById('subj').textContent = 'Subject: ' + m.subject;
    var f = document.getElementById('f'); f.srcdoc = rel ? m.html.replace('<head>', '<head><base href="' + location.href.replace(/[^/]*$/, '') + '">') : m.html;
  }
  document.querySelectorAll('.bar button').forEach(function (b) { b.onclick = function () { show(b.dataset.k); }; });
  show(q.get('k') || 'welcome');
})();
</script>
</body></html>
