<!-- ================= 8 · WAVES & BLUEPRINTS ================= -->
<sc-if value="{{tabMine}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.mine.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">Waves or a tsunami.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>A feeling you let move comes in waves. A feeling you hold onto stacks up and hits you like a tsunami.</p></div>
<p class="lead">Every emotion is a chemical wave. Your brain sends a blend of chemicals through your body to get your attention, and if you let yourself feel it, the wave rises, peaks and passes in about <strong>90 seconds</strong>. So why do some feelings last days, weeks, years? Because we usually do one of two things instead.</p>
<div class="pp2">
<div class="ppc in"><span class="hand">We push it down</span><h3>We bury it alive</h3><p>Bite the lip, hold the tears in, smile, “I’m fine”. When you suppress an emotion, you bury it alive. It doesn’t leave. It gets stored, and every unfelt feeling adds more water to the dam.</p></div>
<div class="ppc in"><span class="hand">We think about it instead</span><h3>We keep the tab open</h3><p>Replaying it, arguing in your head, asking “why do I feel like this?” Each time you pull it back up, you start the wave again, then cut it off before it finishes. Over and over.</p></div>
</div>

 L156 165.5 L160 167.9 L164 169.6 L168 167.2 L172 164.8 L176 162.5 L180 160.4 L184 158.6 L188 157.0 L192 155.7 L196 154.8 L200 154.2 L204 154.0 L208 154.2 L212 154.7 L216 155.6 L220 156.9 L224 158.4 L228 160.2 L232 162.3 L236 164.5 L240 166.9 L244 169.4 L248 168.2 L252 165.8 L256 163.5 L260 161.3 L260 170.0 L264 162.6 L268 155.9 L272 150.6 L276 147.2 L280 146.0 L284 147.2 L288 150.6 L292 155.9 L296 162.6 L300 170.0 L300 170.0 L304 159.3 L308 149.5 L312 141.3 L316 135.4 L320 132.4 L324 132.4 L328 135.4 L332 141.3 L336 149.5 L340 159.3 L344 170.0 L344 170.0 L348 156.1 L352 143.0 L356 131.7 L360 122.7 L364 116.7 L368 114.1 L372 115.0 L376 119.3 L380 126.9 L384 137.1 L388 149.4 L392 163.0 L394 170.0 L398 152.6 L402 136.2 L406 121.4 L410 109.0 L414 99.7 L418 94.0 L422 92.0 L426 94.0 L430 99.7 L434 109.0 L438 121.4 L442 136.2 L446 152.6 L450 170.0" fill="none" stroke="#4C7FD1" stroke-width="3" stroke-linecap="round"/><path d="M450 170 C460 90 480 20 530 20 C570 20 580 50 560 66 C546 76 536 58 546 50 C590 110 600 170 600 220 L450 220 Z" fill="#4C7FD1" fill-opacity=".85"/><path d="M450 170 C460 90 480 20 530 20 C570 20 580 50 560 66 C546 76 536 58 546 50" fill="none" stroke="#1F2E5C" stroke-width="3" stroke-linecap="round"/><line x1="262" y1="26" x2="262" y2="206" stroke="#4E0C08" stroke-width="2" stroke-dasharray="6 6"/><text x="20" y="40" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#4E0C08">Let it move</text><text x="20" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#463A38">Each wave rises, peaks and</text><text x="20" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#463A38">passes in about 90 seconds.</text><text x="280" y="40" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#4E0C08">Hold it in</text><text x="280" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#463A38">It stacks, and stacks,</text><text x="280" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#463A38">until it hits like a tsunami.</text></svg></div>
<p class="lead">When feelings stack up, they come out one of two ways:</p>
<div class="pp2">
<div class="ppc out"><span class="hand">Held too long</span><h3>A mood</h3><p>You push it down, it pops back up, you push it down again. All day, all week. That’s how 90 seconds of sadness turns into a bad mood you can’t snap out of, that you take out on the people you love and on yourself.</p></div>
<div class="ppc out"><span class="hand">Held down too tight</span><h3>A meltdown</h3><p>The lid gets held down so tight that eventually it blows. Small event, big reaction: you break your favourite mug and the dam breaks with it. A meltdown isn’t an adult tantrum. It’s your nervous system finally releasing everything you couldn’t.</p></div>
</div>
<div class="qblock">
<h3>Signs it’s stacking</h3>
<div class="signs"><span class="sg">Decisions feel harder than usual</span><span class="sg">Shorter, snappier, more irritable</span><span class="sg">Small things knock your mood</span><span class="sg">Pulling away from your people</span><span class="sg">Tension in your neck, jaw or shoulders</span><span class="sg">Tired for no reason</span></div>
<p class="bodycue">These are your cues to let something move, before the lid blows.</p>
</div>
<div class="qblock">
<h3>Can’t let it out right now?</h3>
<p class="bodycue">On the train, at work, in the supermarket. You don’t always need a big release. You need to get it out of your head and into your body.</p>
<div class="li"><span class="d">1</span><span><strong>Write it.</strong> What you feel in your body, the trigger, how it made you feel. Don’t try to make sense of it. Just write until it’s out. Writing takes it out of your head, where it loops, and into your body.</span></div>
<div class="li"><span class="d">2</span><span><strong>Move it.</strong> Shake out anxiety. Wrap your arms around yourself for fear. Ball up your fists for anger and feel the pressure.</span></div>
<div class="li"><span class="d">3</span><span><strong>Come back to it.</strong> When it pops back up later, in the shower or sitting in the car, that’s your chance. Let yourself cry, even if you don’t know why.</span></div>
</div>
<div class="callout lime"><span><strong>This is what your blueprints are for.</strong> Every check-in shows you your own patterns: what sets each emotion off, the signs it’s building, and what it needs. So you can let it move before it stacks.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>Feel it for 90 seconds now, or carry it for years.</p></div>

<section class="sec">
<div class="eyebrow">Why you feel stuck</div>
<h2 class="h2">You’re not dealing with today’s feelings. You’re dealing with thirty years of them.</h2>
<p class="lead">Every time you didn’t get to feel something fully, it got stored. One bead on a string. Then another. Then another. Now one small thing sets off a reaction that’s way bigger than the moment, because it’s carrying every bead before it.</p>
<p class="lead">The tools in this app help you drain the pressure, one feeling at a time. They give you real relief. But they don’t change your attachment to the past. That’s what ECT does.</p>
</section>

<section class="dark sec" style="padding: 30px 26px; gap: 18px">
<div class="eyebrow">What is ECT?</div>
<h2 class="h2" style="color: #FFF4EE">The Emotional Change Technique.</h2>
<p class="lead">ECT guides you into your unconscious mind to change the emotions attached to the past. Rather than taking the beads off one at a time, each ECT session cuts a whole emotional string. Here’s how it works, using anger as an example.</p>
<div class="esteps">
<div class="estep"><img class="eimg" src="/tools/assets/e01ae0b495eb9a16003c5c3192cb7164.jpg" alt="A woman furiously hitting pillows on the road of her past, flames rising, and a jar of fire labelled present."><span class="en2">1</span><h3>Activate it</h3><p>Instead of holding anger down, we help you bring it up and burn it bright. Big. Fiery.</p></div>
<div class="estep"><img class="eimg" src="/tools/assets/8d2542df94e91b4e443b9304ceec32bb.jpg" alt="The same woman back at the very start of her timeline, where the anger first began."><span class="en2">2</span><h3>Go back</h3><p>We guide you back along your timeline to where anger began. You don’t need to consciously remember it. Your body will tell you.</p></div>
<div class="estep"><img class="eimg" src="/tools/assets/f3007d98cfc9c98fbe52e337a6e48165.jpg" alt="The woman drenched with water, the fire out and smoking, the jar of embers in a puddle."><span class="en2">3</span><h3>Release it</h3><p>At the root, we take that giant fire and douse it with a bucket of water, taking the emotional charge out of it.</p></div>
<div class="estep"><img class="eimg" src="/tools/assets/114034fde36eefbd5f3ebf16913978a4.jpg" alt="The past now lined with smiling yellow faces, the woman calmly watering the road, and a happy glowing jar in the present."><span class="en2">4</span><h3>Reframe and rise</h3><p>We give the event a new, empowering meaning, and bring it back up your timeline with you, filling the anger tank with joy, compassion and calm.</p></div>
</div>
</section>

<section class="sec">
<div class="eyebrow">How it’s held in your body</div>
<h2 class="h2">The {{b7n}} stack up in layers.</h2>
<p class="lead">Love is at the core of everything. Over the years, the {{b7n}} build up on top of it, layer by layer, to protect you. Anger sits on the outside, because it’s your fight-or-flight response: defensiveness, protecting yourself from the world. Underneath, the anger is holding the sadness down. And right at the centre, joy is wrapped around love, squashed by everything above it, with no room to expand.</p>
<div class="stackwrap">
<img class="layersimg" src="/tools/assets/e764c61511bfe0dca82c3f449cc298c5.png" alt="The outline of a person filled with layers that follow the shape of the body: anger around the outer edge, then sadness, hurt, fear, guilt, shame, grief, joy, and a small heart of love in the chest.">
<div class="laylist"><sc-for list="{{stackLayers}}" as="l" hint-placeholder-count="9"><div class="lay" style="border-left-color: {{l.col}}"><span class="layn" style="background: {{l.col}}">{{l.i}}</span><span><strong>{{l.n}}</strong>{{l.t}}</span></div></sc-for></div>
</div>
<p class="lead">Now watch what happens when they’re released, one by one:</p>
<div class="frames"><sc-for list="{{stackFrames}}" as="f" hint-placeholder-count="7"><div class="frm"><img src="{{f.img}}" alt="{{f.alt}}"><div class="frmt"><span class="frk">{{f.k}}</span><strong>{{f.t}}</strong><p>{{f.d}}</p></div></div><sc-if value="{{f.arrow}}" hint-placeholder-val="{{ true }}"><div class="frarrow" aria-hidden="true">↓</div></sc-if></sc-for></div>

<div class="callout lime"><span><strong>Anger becomes passion.</strong> Released energy doesn’t vanish, it transmutes. Sadness becomes compassion, fear becomes excitement, and joy and love finally get to radiate outward.</span></div>
<div class="twoways">
<div class="twy"><span class="hand" style="font-size: 16px; color: #A8231F">Processing in the app</span><strong>Conscious, small scale</strong><p>When you process a feeling in this app, you’re doing it consciously. It works, and it gives real relief, but it loosens the grip a little at a time, releasing small pieces off the top of the stack.</p></div>
<div class="twy ect"><span class="hand" style="font-size: 16px; color: #F1F9A6">ECT</span><strong>Unconscious, the whole lot</strong><p>ECT works with your unconscious mind. It goes back to the root and releases the whole layer, years of it, in one go, so the next layer can come up and go too.</p></div>
</div>
</section>

<p class="lead">In six sessions we work through all seven emotions, plus two limiting beliefs from the past, like “I’m not good enough” or “I’m not worthy”. We’ll choose the ones that will make the biggest difference for you.</p>

<div class="callout lime"><span><strong>Moving up the levels.</strong> Every emotion you release at the root frees energy that was stuck below Courage. That’s how you start living from connection instead of protection.</span></div>

<img class="storyimg" src="/tools/assets/2aa85a10e798befdc83d0b8a2eb9f860.jpg" alt="Sav’s timeline: on the right, a dark night-time path through the moments of her past. On the left, the same life after ECT, a sunlit path through a field of wildflowers to her memory library.">

<span class="eyebrow">From Sav</span>
<p class="ecq">“When I look back at my timeline now, all I see are flowers.”</p>
<p class="body">Where I used to see hurt, shame, public embarrassment, judgement, self-abandonment, fear, heartbreak, anger and sadness, now I see compassion, love, joy, gratitude and happiness. Everything that once felt painful has become a field of wildflowers.</p>
<p class="body">ECT gave me my life back. It gave me a fresh start, and let me create new identities and upgrade the way I think, feel and act, without that tether to the past holding me back. It made everything else I was learning so much easier, because I was only dealing with the feelings of now.</p>

<section class="sec">
<div class="eyebrow">What changes</div>
<div class="b7s">
<div class="gcard"><h3>It takes so much more to trigger you</h3><p>You’re no longer carrying decades of emotional fuel waiting to explode.</p></div>
<div class="gcard"><h3>You still feel, just in proportion</h3><p>You’ll still feel anger, fear and sadness. Happiness needs sadness to exist. But it’s a normal, healthy amount, and it passes.</p></div>
<div class="gcard"><h3>Everything else gets easier</h3><p>The tools, the habits, the new identity. They stick, because the past isn’t pulling you back.</p></div>

<section class="sec">
<div class="eyebrow">Questions</div>
<div class="faq">
<details><summary>Do I need to remember what happened?</summary><p>No. You don’t need to consciously remember the first time you felt an emotion. Your body will tell you.</p></details>
<details><summary>Will I never feel anger or sadness again?</summary><p>You will, and that’s healthy. You can’t feel happiness without sadness. The difference is the intensity. It becomes a normal amount, much harder to trigger, and it passes.</p></details>
<details><summary>Is ECT part of the Breakthrough program?</summary><p>No. ECT is an extensive process that needs six 1:1 sessions with a practitioner, so it’s a separate Emotional Breakthrough program.</p></details>
<details><summary>How do I know if I’m ready?</summary><p>If you’re tired of carrying the past, if small things set off big reactions, or if you’ve done the work and still feel something pulling you back, it’s worth a conversation.</p></details>
<details><summary>Is ECT therapy?</summary><p>ECT is a coaching technique, not a replacement for mental health care. If you’re working with a psychologist or counsellor, keep them in the loop.</p></details>
</div>
</section>
