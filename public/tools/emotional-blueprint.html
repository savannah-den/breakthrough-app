<sc-if value="{{m.c0}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">What this is for</span><p>Most of us can feel something, but can’t name it. This app helps you find the word you’re missing, make sense of it, and then actually move it through your body.</p></div>
<h3 class="mh">Four ways in. Which one are you?</h3>
<p class="lead">Everyone’s brain processes emotions a little differently. There are four doors into this app, one for each type. Have a read, and notice which one sounds most like you. You can use any door, any time, and you might find you use different ones on different days.</p>
<div class="ways"><sc-for list="{{wayCards}}" as="w" hint-placeholder-count="4"><div class="way" style="border-top-color: {{w.col}}"><img src="{{w.img}}" alt="{{w.alt}}"><span class="wayk" style="color: {{w.col}}">{{w.k}}</span><strong>{{w.t}}</strong><p>{{w.who}}</p><span class="waydoor"><b>Your door:</b> {{w.door}}</span><button class="ghost solid" onClick="{{w.go}}">{{w.btn}}</button></div></sc-for></div>
<h3 class="mh">The search speaks your language</h3>
<p class="lead">Type how you feel in your own words. It finds the closest feeling on the wheel and lights it up.</p>
<div class="mock" aria-hidden="true">
<span class="mockl">How are you feeling? Use your own words or click any label on the chart below.</span>
<span class="mockin">I’m so swamped<span class="caret"></span></span>
<span class="mockhit" style="border-left-color: #6B4FB0"><span class="mfdot" style="background: #6B4FB0"></span><span><strong>“Swamped” sounds like overwhelmed.</strong><span>Overwhelmed is rooted in fear · rung 1, the louder flavours</span></span></span>
</div>
<h3 class="mh">How it works, start to finish</h3>
<p class="lead">Let’s follow one feeling all the way through. Say it’s been a day, and you’re frustrated.</p>
<div class="exsteps">
<div class="exs"><span class="exn">1</span><div class="exb"><strong>Find it.</strong><span>Type “so over it”, or tap <b>Frustrated</b> on the wheel.</span><div class="exv"><img class="exslice" src="/tools/assets/67991f5dea14c9c436b7f8e6457ce229.svg" alt=""><span class="exhl" aria-hidden="true"></span></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">2</span><div class="exb"><strong>Its card opens.</strong><span>Everything you need to make sense of it, in one place.</span><div class="exv"><div class="mcard"><span class="mctag">Rung 1 · the louder flavours</span><strong>Frustrated</strong><span class="mcroot">If you’re feeling frustrated, it’s rooted in anger.</span><span class="mcb">“Why is this so hard?”</span><span class="mcb">“Nobody listens.”</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">3</span><div class="exb"><strong>Make sense of it.</strong><span>Where it sits, what it does to your energy, and where it’s heading.</span><div class="exv"><div class="mpath"><span style="background: #D3302B; color: #FFFFFF">Anger</span>→<span style="background: #E2645F; color: #FFFFFF">Frustrated</span>→<span style="background: #F1A9A6">Annoyed</span><i>┆</i><span style="background: #FFF4D6; border: 1.5px solid #4E0C08">Passion</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">4</span><div class="exb"><strong>Tell it about your body.</strong><span>You answer a few questions about how it feels in your body, so we can build a blueprint of that emotion, just for you.</span><div class="exv"><div class="mockchips"><span class="chip small on">Tight jaw</span><span class="chip small on">Hot face</span><span class="chip small">Clenched fists</span><span class="chip small on">Snapping at people</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">5</span><div class="exb"><strong>Rate how loud it is.</strong><span>You check in with your body and rate it, 0 to 10. Say it’s sitting at about a 6.</span><div class="exv"><div class="mint" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span class="on">6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">6</span><div class="exb"><strong>Get a plan for that volume.</strong><span>At a 6, it’s turned up: too loud to reason with. So the card tells you to move it through your body first, one rung outward, from frustrated towards annoyed. Plus the tools that help with anger at this level.</span><div class="exv"><div class="mockhit" style="border-left-color: #D3302B" aria-hidden="true"><span class="mfdot" style="background: #D3302B"></span><span><strong>4–6 · Turned up</strong><span>Move it through your body, one rung outward.</span></span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">7</span><div class="exb"><strong>Choose: keep it, or move it.</strong><span>This is the big question on every card.</span><div class="exv"><div class="mbind col"><span class="mbk"><b>Keep my problem with frustrated</b>Put it up on the shelf and carry it longer, and let the trapped energy quietly drain me.</span><span class="mbg"><b>Process it and let it go</b>Move it through my body now, get one rung closer to passion, and get my energy back.</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">8</span><div class="exb"><strong>Process it, step by step.</strong><span>Choose to process it, and you’re taken to Process it with everything you’ve already told us filled in. Then I guide you through moving it through your body.</span><div class="exv"><div class="carry" aria-hidden="true"><span class="mrh">What you’ve told us so far</span><p>You’re processing frustrated, rooted in anger, at 6 out of 10.</p><p>You feel it: tight jaw, hot face.</p></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">9</span><div class="exb"><strong>It’s saved to your blueprint.</strong><span>Whichever you choose, it’s saved, so your blueprint keeps learning you.</span><div class="exv"><div class="mentry"><span class="mctag">Today · anger</span><strong>Frustrated · 6/10</strong><span><b>In my body:</b> tight jaw, hot face</span><span><b>It made me:</b> snap at people</span><span><b>What happened:</b> the third interruption before 9am</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">10</span><div class="exb"><strong>Over time, it learns you.</strong><span>After a few weeks, your blueprint starts showing you patterns you couldn’t see before: what sets each emotion off, the early signs it’s building, and what actually helps you let it go.</span><div class="exv"><div class="mentry big"><span class="mctag">Your anger blueprint · after a few weeks</span><strong>How anger shows up for you</strong><span><b>The early signs:</b> tight jaw, hot face, short answers</span><span><b>It usually kicks in when:</b> you’re interrupted, or not listened to</span><span><b>It makes you:</b> snap, then go quiet</span><span><b>What helps you let it go:</b> stomping it out, a loud song in the car</span></div></div></div></div>
<div class="exarrow" aria-hidden="true">↓</div>
<div class="exs"><span class="exn">11</span><div class="exb"><strong>And if you keep it? It goes on your shelf.</strong><span>Your shelf groups the same emotions together, so when you’re ready, you can process them all in one go. But the more you put up there, the heavier it gets, and the more energy it takes to hold it all up.</span><div class="exv"><img src="/tools/assets/b56d90f66181fc1cb147686bd30dd4d2.svg" alt="" style="width: 96px; height: 96px"></div></div></div>
</div>
<div class="callout lime"><span><strong>That’s the whole point of this.</strong> We can’t think our way through emotions. We have to feel through them. And I’ll guide you through that process.</span></div>
<div class="printcard"><img src="/tools/assets/51497c2cfaa41f0357b287d0f8c03c58.png" alt="The printable Energy in Motion wheel poster."><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 240px"><span class="hand" style="font-size: 16px; color: #A8231F">Put it on your wall</span><strong style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; line-height: 1.2">Print the wheel</strong><p class="body">An A3 poster with a QR code that brings you straight back here.</p><a class="primary maroon" href="/tools/assets/39dc06590a0be01292c4b7e5b25de439.pdf" download="energy-in-motion-wheel.pdf" target="_blank" rel="noopener" style="align-self: flex-start">Download the A3 poster</a></div></div>
</sc-if>

<sc-if value="{{m.c1}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>An emotion only needs about 90 seconds to move through your body. It’s the not-feeling that makes it last for years.</p></div>
<p class="lead">Every emotion is a chemical wave. Your brain releases a very specific blend of neurotransmitters and hormones, like little cars on the highway of your vagus nerve, carrying messages to your body. When you’re sad, they tell your eyes to well up, your chest to tighten, a lump to form in your throat and your bottom lip to quiver.</p>
<div class="wavecmp">
<figure class="wfig"><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="One smooth wave that rises, peaks and passes."><line x1="10" y1="96" x2="290" y2="96" stroke="#4E0C08" stroke-width="2"></line><path d="M10 96 C70 96 90 20 150 20 C210 20 230 96 290 96" fill="none" stroke="#4C7FD1" stroke-width="6" stroke-linecap="round"></path><text x="150" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#4E0C08">about 90 seconds</text></svg><figcaption><strong>Felt in your body</strong>It rises, peaks, and passes. Done.</figcaption></figure>
<figure class="wfig"><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="A wave that keeps restarting before it finishes, over and over."><line x1="10" y1="96" x2="290" y2="96" stroke="#4E0C08" stroke-width="2"></line><path d="M10 96 C30 96 40 40 60 40 L62 96 C82 96 92 36 112 36 L114 96 C134 96 144 34 164 34 L166 96 C186 96 196 30 216 30 L218 96 C238 96 248 26 268 26 L270 96" fill="none" stroke="#D3302B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><text x="150" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#4E0C08">days, weeks, years</text></svg><figcaption><strong>Thought about, in your head</strong>Every replay restarts the wave, then cuts it off before it finishes.</figcaption></figure>
</div>
<h3 class="mh">So what does “being in your body” actually mean?</h3>
<p class="lead">It means your attention is on what you can physically feel right now, instead of on the story about it. Your head asks “why?”. Your body just tells you “what”.</p>
<div class="headbody">
<div class="hbh"><span>In your head</span><span>In your body</span></div>
<div class="hbr"><span>“Why does this always happen to me?”</span><span>“There’s a heavy ball in my stomach.”</span></div>
<div class="hbr"><span>“I can’t believe she said that.”</span><span>“My face is hot and my jaw is tight.”</span></div>
<div class="hbr"><span>“What if it all goes wrong?”</span><span>“My chest is buzzing and my breath is up high.”</span></div>
</div>
<div class="trynow"><span class="hand" style="font-size: 16px; color: #A8231F">Try it now · 30 seconds</span>
<div class="li"><span class="d">1</span><span>Put both feet flat on the floor. Notice the pressure under them.</span></div>
<div class="li"><span class="d">2</span><span>Take a slow breath in, and a longer breath out. Where does the breath move?</span></div>
<div class="li"><span class="d">3</span><span>Scan from your head down. Is there tightness, heat, heaviness, buzzing, a lump?</span></div>
<div class="li"><span class="d">4</span><span>Just name it, without the why: “there’s tightness in my chest.” That’s it. You’re in your body.</span></div>
</div>
<div class="pp2">
<div class="ppc out"><span class="hand">Associated · in your body</span><h3>Present, feeling it</h3><p>Like a little kid smacking a spoon on a pot just to see what happens. You feel things as they happen, and they move through.</p></div>
<div class="ppc in"><span class="hand">Dissociated · in your head</span><h3>Watching from the outside</h3><p>Overthinking, replaying, worrying how you look. It’s a protection mechanism: your mind pulls you out of your body so you don’t have to feel it. But your body still does.</p></div>
</div>
<div class="callout lime"><span><strong>“If you’re in your head, you’re dead.”</strong> You can’t think a feeling away. When you push it down, you bury it alive. To move it, you have to feel it, in your body. That’s what energy in motion means.</span></div>
</sc-if>

<sc-if value="{{m.c2}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>There’s no such thing as a good or bad emotion. Who taught you that anger was bad?</p></div>
<p class="lead">Most of us grew up hearing some version of these:</p>
<div class="myths">
<div class="myth"><span class="mk1">What we heard</span><strong>“Good girls don’t get angry.”</strong><span class="mk2">The truth</span><p>Anger is a boundary. It has to exist for you to feel passion.</p></div>
<div class="myth"><span class="mk1">What we heard</span><strong>“Big girls don’t cry.”</strong><span class="mk2">The truth</span><p>Crying is your body processing sadness, in about 90 seconds.</p></div>
<div class="myth"><span class="mk1">What we heard</span><strong>“Stop being so dramatic.”</strong><span class="mk2">The truth</span><p>Big feelings are often years of small ones that never got felt.</p></div>
<div class="myth"><span class="mk1">What we heard</span><strong>“Be grateful, other people have it worse.”</strong><span class="mk2">The truth</span><p>You can be grateful and sad at the same time. Both are allowed.</p></div>
<div class="myth"><span class="mk1">What we heard</span><strong>“Don’t be scared, it’s nothing.”</strong><span class="mk2">The truth</span><p>Fear is your body trying to protect you. And it’s the same energy as excitement.</p></div>
</div>
<p class="lead">So we hid the “bad” ones. But if you’d never felt sad, how would you know when you feel happy? I don’t know I’m tall until I stand next to someone shorter. We need the contrast.</p>
<figure class="bigimg"><img src="/tools/assets/c0ee1f2c4eb226136fc9f66e3cd4e33e.jpg" alt="A line drawing dipping down to a sad raincloud at the bottom of a scale marked sadness, then rising high to a smiling sun at the top marked happiness."><figcaption>The depth you let yourself feel one is the depth you get to feel the other.</figcaption></figure>
<p class="lead">It’s the same with anger. It sits on the same spectrum as passion:</p>
<div class="spectrum"><img src="/tools/assets/d5f1511a86c00d5f6c0ac6fc45bde973.jpg" alt="The anger spectrum: rage, anger, frustration, determined, motivated, passionate."></div>
<p class="lead">On the left, the energy is unintegrated: held in, pushed down, working against you. On the right, the very same energy is integrated: felt, released, and working for you.</p>
</sc-if>

<sc-if value="{{m.c3}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Your body knows what you feel before your mind has a word for it.</p></div>
<p class="lead">Every emotion releases its own cocktail of hormones and neurotransmitters, and that cocktail makes your body express it in very specific ways. There’s a shared experience to most feelings: fear makes most hearts race, sadness makes most chests heavy. But we also each feel them a little differently. Your anger might live in your jaw. Someone else’s lives in their fists.</p>
<p class="lead">That’s why mapping how you feel in your body matters. It tells you what you’re actually feeling, and what you need to clear to move through it. Have a play: tap anywhere on the body.</p>
<div class="demo">
<div class="demomap"><div class="bodymap2">
<svg width="300" height="484" viewBox="0 0 300 484" aria-hidden="true"><g transform="translate(20 0)"><circle cx="130" cy="52" r="36" fill="#F6E3F7"></circle><path d="M130 86V142" stroke="#F6E3F7" stroke-width="28" stroke-linecap="round"></path><path d="M78 146Q130 128 182 146L174 302Q130 316 86 302Z" fill="#F6E3F7"></path><path d="M82 150Q54 160 46 218L36 322" fill="none" stroke="#F6E3F7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path><path d="M178 150Q206 160 214 218L224 322" fill="none" stroke="#F6E3F7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path><path d="M108 304L100 466M152 304L160 466" fill="none" stroke="#F6E3F7" stroke-width="32" stroke-linecap="round"></path></g><circle cx="150" cy="18" r="8" fill="#9B6FD1" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="46" r="8" fill="#4B3F9E" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="116" r="8" fill="#4C7FD1" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="190" r="8" fill="#5FA35A" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="240" r="8" fill="#F2C230" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="276" r="8" fill="#F28C3B" stroke="#4E0C08" stroke-width="2"></circle><circle cx="150" cy="302" r="8" fill="#D3302B" stroke="#4E0C08" stroke-width="2"></circle></svg>
<sc-for list="{{cBodyBtns}}" as="b" hint-placeholder-count="12"><button class="{{b.cls}}" onClick="{{b.pick}}"><span class="pd" style="background: {{b.col}}"></span>{{b.l}}</button></sc-for>
</div></div>
<sc-if value="{{cDemoNone}}" hint-placeholder-val="{{ true }}"><p class="hn" style="margin: 0">Tap a spot on the body to see what it might be telling you.</p></sc-if>
<sc-if value="{{cDemoHas}}" hint-placeholder-val="{{ false }}"><div class="demores"><strong>{{cDemoN}}</strong><p>{{cDemoSays}}</p><span class="mrh">Ask yourself</span><p>{{cDemoAsk}}</p><span class="mrh">It might be</span><div class="chips"><sc-for list="{{cDemoEmos}}" as="e" hint-placeholder-count="3"><button class="chip small" onClick="{{e.pick}}"><span class="dotc" style="background: {{e.col}}"></span>{{e.l}}</button></sc-for></div></div></sc-if>
</div>
<div class="callout cream"><span>You can play with this in more detail using the <strong>Body map</strong> in the menu at the top.</span></div>
</sc-if>

<sc-if value="{{m.c4}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Inside the dotted line is held in. Outside is integrated. Every path moves outward.</p></div>
<div class="learnwheel"><img src="/tools/assets/155c64712190eac9be159d6ad01d6e35.svg" alt="The Energy in Motion wheel."></div>
<p class="lead">Nine roots sit in the middle: the {{b7n}}, plus joy and love. Let’s zoom in on one slice. Tap each number to see what that part means.</p>
<div class="annwrap"><img src="/tools/assets/67991f5dea14c9c436b7f8e6457ce229.svg" alt="A zoomed-in slice of the wheel for anger."><sc-for list="{{cPins}}" as="p" hint-placeholder-count="7"><button class="{{p.cls}}" style="left: {{p.x}}%; top: {{p.y}}%" aria-label="{{p.l}}" onClick="{{p.pick}}">{{p.n}}</button></sc-for></div>
<div class="anncard" aria-live="polite"><span class="annn">{{cAnnN}}</span><div><strong>{{cAnnT}}</strong><p>{{cAnnD}}</p></div></div>
<div class="annlist"><sc-for list="{{cPins}}" as="p" hint-placeholder-count="7"><button class="{{p.lcls}}" onClick="{{p.pick}}"><span class="annn sm">{{p.n}}</span>{{p.t}}</button></sc-for></div>
<h3 class="mh">Held in vs integrated</h3>
<div class="pp2">
<div class="ppc in"><span class="hand">Unintegrated · inside the line</span><h3>Chaotic, out of control, destructive</h3><p>The emotion was never fully felt, so it’s still in your body. It leaks out sideways: snapping, shutting down, overthinking, spiralling, a mood you can’t shake. It runs you, and it costs you.</p></div>
<div class="ppc out"><span class="hand">Integrated · outside the line</span><h3>Grounded, useful, in your control</h3><p>It’s been felt all the way through and released. It still visits, but it moves through in waves, and its energy becomes fuel: drive, compassion, courage, connection.</p></div>
</div>
<div class="callout"><span><strong>Why it matters: your energy.</strong> Emotions are energy in motion. When you hold one still, it doesn’t disappear. It bounces around inside you like a bull in a cage, wanting out, and you spend your own energy holding the gate shut. That’s why stuck emotions leave you so tired.</span></div>
<p class="lead">Here’s anger, moving outward, one step at a time:</p>
<div class="vstages"><sc-for list="{{cAngerPath}}" as="sr" hint-placeholder-count="4"><sc-if value="{{sr.line}}" hint-placeholder-val="{{ false }}"><div class="intline"><span>The integrated line</span></div></sc-if><div class="vst"><img src="{{sr.img}}" alt="{{sr.alt}}"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span class="vk">{{sr.k}}</span><strong>{{sr.n}}</strong><span>{{sr.cap}}</span></div></div><sc-if value="{{sr.arrow}}" hint-placeholder-val="{{ true }}"><div class="frarrow" aria-hidden="true">↓</div></sc-if></sc-for></div>
<div class="callout lime"><span><strong>You can’t think your way across the line.</strong> Thinking about a feeling keeps it in your head. To move it, you have to feel it in your body: cry it, shake it, breathe it, move it. Energy in motion.</span></div>
<div class="twoways">
<div class="twy"><span class="hand" style="font-size: 16px; color: #A8231F">In this app</span><strong>Loosening the grip, one bit at a time</strong><p>Processing here is conscious. It works, and it gives real relief, but on a small scale: you loosen the grip and release small pieces at a time.</p></div>
<div class="twy ect"><span class="hand" style="font-size: 16px; color: #F1F9A6">With ECT</span><strong>Releasing the whole stack</strong><p>ECT works with your unconscious mind, going back to the root and releasing years of an emotion all at once, in your whole body. You can learn more about it in the menu at the top. Explore that later.</p></div>
</div>
</sc-if>

<sc-if value="{{m.c5}}" hint-placeholder-val="{{ false }}">
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Love is at the core of everything. The {{b7n}} stack up around it, layer by layer, until nothing can move.</p></div>
<p class="lead">Think of the {{b7n}} as layers your body has built up to protect you, each one following the shape of you. Anger is the outer layer, right near the edge, because it’s your fight-or-flight response: defensiveness, protecting yourself from the world. Inside that sits sadness, then hurt, and so on. And right at the centre, joy is wrapped around love, squashed by everything above it, with no room to expand.</p>
<div class="stackwrap">
<img class="layersimg" src="/tools/assets/e764c61511bfe0dca82c3f449cc298c5.png" alt="The outline of a person filled with layers that follow the shape of the body: anger around the outer edge, then sadness, hurt, fear, guilt, shame, grief, joy, and a small heart of love in the chest.">
<div class="laylist"><sc-for list="{{stackLayers}}" as="l" hint-placeholder-count="9"><div class="lay" style="border-left-color: {{l.col}}"><span class="layn" style="background: {{l.col}}">{{l.i}}</span><span><strong>{{l.n}}</strong>{{l.t}}</span></div></sc-for></div>
</div>
<p class="lead">While they’re held in, every emotion is locked into its own section, with hard edges. Now watch what happens when they’re released, one by one:</p>
<div class="frames"><sc-for list="{{stackFrames}}" as="f" hint-placeholder-count="9"><div class="frm"><img src="{{f.img}}" alt="{{f.alt}}"><div class="frmt"><span class="frk">{{f.k}}</span><strong>{{f.t}}</strong><p>{{f.d}}</p></div></div><sc-if value="{{f.arrow}}" hint-placeholder-val="{{ true }}"><div class="frarrow" aria-hidden="true">↓</div></sc-if></sc-for></div>
<div class="callout lime"><span><strong>Anger becomes passion.</strong> When anger dissolves, it doesn’t vanish. It turns into passion, and it can flow around your body freely. The same goes for every layer: sadness becomes compassion, fear becomes excitement, and joy and love finally get to radiate outward, big.</span></div>
</sc-if>

<!-- ================= 1 · ENERGY ================= -->
<sc-if value="{{tabEnergy}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.energy.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">Emotions are energy in motion.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Emotions are energy in motion. And energy can neither be created nor destroyed, only transmuted into something new.</p></div>
<p class="lead">E-motion: energy in motion. Every emotion is a signal, your brain waving a flag going “oi, can you feel this please, so we can move on?” It’s meant to move through you. When it can’t move, it gets stuck. When it can, it becomes something useful.</p>
<div class="eyebrow" style="margin-top: 6px">Mini lesson</div>
<h2 class="h2" style="font-size: clamp(26px, 4.4vw, 34px)">There’s no good or bad emotion. Just a spectrum.</h2>
<p class="lead">Most of us were taught that some emotions are bad. Don’t get angry. Don’t cry in front of people. Be grateful, be happy. So we hide the “bad” ones. But who taught you that? It’s worth challenging. Every emotion sits on a spectrum with its integrated version at the other end. Here’s anger:</p>
<div class="spectrum"><img src="/tools/assets/d5f1511a86c00d5f6c0ac6fc45bde973.jpg" alt="The anger spectrum: six faces from deep red to soft pink, labelled rage, anger, frustration, determined, motivated and passionate, along one line."></div>
<div class="pp2">
<div class="ppc in"><span class="hand">One end</span><h3>Unintegrated</h3><p>Rage, anger, frustration. The energy is held in, pushed down or not expressed, so it builds up and works against you.</p></div>
<div class="ppc out"><span class="hand">The other end</span><h3>Integrated</h3><p>Determined, motivated, passionate. The energy has been felt and released, so it’s free to work for you.</p></div>
</div>
<p class="lead">You need both ends. If you’d never felt sad, how would you know you feel happy? It’s like height: I don’t know I’m tall until I stand next to someone shorter. Emotions need the contrast too.</p>
<div class="myths">
<div class="myth"><span class="mk1">What we were taught</span><strong>“Anger is bad.”</strong><span class="mk2">The truth</span><p>Anger is a boundary. Integrated, it’s the fuel for passion.</p></div>
<div class="myth"><span class="mk1">What we were taught</span><strong>“Crying means I’m weak.”</strong><span class="mk2">The truth</span><p>Crying is your body processing sadness. Let it move and it takes about 90 seconds.</p></div>
<div class="myth"><span class="mk1">What we were taught</span><strong>“I should just be happy.”</strong><span class="mk2">The truth</span><p>Happy only exists because sad does. You need the contrast to feel the difference.</p></div>
<div class="myth"><span class="mk1">What we were taught</span><strong>“If I let it out, it’ll never stop.”</strong><span class="mk2">The truth</span><p>A feeling you let move comes in waves. It’s holding on that turns it into a tsunami.</p></div>
<div class="myth"><span class="mk1">What we were taught</span><strong>“Good emotions are fine, bad ones aren’t.”</strong><span class="mk2">The truth</span><p>Joy, love and excitement are energy too. When you shut down the “bad” ones, you numb the good ones right along with them.</p></div>
</div>
<div class="eyebrow" style="margin-top: 6px">Watch the energy move</div>
<h2 class="h2" style="font-size: clamp(26px, 4.4vw, 34px)">What integrating an emotion looks like.</h2>
<p class="lead">Here’s anger as energy. Full-volume anger is a tight, tangled scribble: all that energy, stuck and messy. Frustration is looser. Annoyance starts to unravel, flying off in every direction. And passion? The same three lines, all heading one way, towards a goal. That’s integrated emotion: the same energy, finally useful.</p>
<div class="series"><sc-for list="{{angerSeries}}" as="sr" hint-placeholder-count="4"><figure class="sfig"><img src="{{sr.img}}" alt="{{sr.alt}}"><figcaption><span class="sk">{{sr.k}}</span><strong>{{sr.n}}</strong><span>{{sr.cap}}</span></figcaption></figure></sc-for></div>
<p class="lead">Every one of the Big 7 has its own picture. Sadness is water, fear is electric, hurt is a heart. You’ll find them all in the tool below.</p>
<div class="callout lime"><span><strong>Fear and excitement are the same energy.</strong> Same butterflies, same racing heart. Fear is pointed at what might go wrong. Excitement is pointed at what might go right. Some people call it being “nerve-excited”.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>There are no bad emotions, only unprocessed ones.</p></div>
<div class="navrow"><sc-if value="{{lx.energy.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.energy.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.energy.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.energy.toggle}}">Hide the lesson</button></sc-if></div>
</section>
</sc-if>
<sc-if value="{{lx.energy.closed}}" hint-placeholder-val="{{ false }}"><div class="lbar"><span class="lbadge sm">✦</span><span class="lbt"><strong>Emotions are energy in motion</strong> · lesson done</span><button class="ghost" onClick="{{lx.energy.toggle}}">Read the lesson again</button></div></sc-if>

<section class="toolsec" id="tool-energy">
<div class="toolhead"><span class="tk">The tool</span><h2 class="h2">The energy ladder.</h2><p><strong>What it’s for:</strong> noticing where you’re holding unintegrated emotion that’s holding you back, and learning that no emotion is good or bad. They all sit on a spectrum. <strong>How to use it:</strong> tap any ring on the wheel to open it, or pick the emotion that’s closest below, read what it looks like held in vs integrated, then tap each rung, from full volume down to the gift.</p></div>
<div class="wheelwrap" style="max-width: 720px"><img src="/tools/assets/8cedfdc02165a506b164a81914fdb102.svg" alt="The energy wheel. The seven emotions sit around the centre in their darkest colour, each with two lighter rings of its states, like anger, frustration and annoyance. A dotted line marked ECT circles them, with arrows pointing out to the outer ring: the integrated gift of each emotion, like passion, compassion, excitement, forgiveness, integrity, self-acceptance and gratitude.">
<sc-for list="{{enWheelBtns}}" as="w" hint-placeholder-count="28"><button class="{{w.cls}}" style="left: {{w.x}}%; top: {{w.y}}%" aria-label="{{w.l}}" onClick="{{w.pick}}"></button></sc-for>
</div>
<div class="howread">
<div class="hr1"><span class="sw" style="background: #D3302B"></span><span><strong>The darkest colour is the core emotion.</strong> One of the Big 7.</span></div>
<div class="hr1"><span class="sw" style="background: #EE9E9B"></span><span><strong>The two lighter rings are states of that core feeling.</strong> Frustration and annoyance are both anger, just quieter. They all link back to the core.</span></div>
<div class="hr1"><span class="sw dash"></span><span><strong>The dotted line is ECT,</strong> the way to integrate it, in your body.</span></div>
<div class="hr1"><span class="sw" style="background: #F9E3E2; border: 1.5px solid #4E0C08"></span><span><strong>The outer ring is the integrated version.</strong> The gift that energy becomes once it’s released.</span></div>
</div>
<div class="callout cream"><span><strong>Why only these 7?</strong> These are the seven emotions that aren’t serving you right now, because they’re unintegrated: held in, pushed down, and not being expressed. They’re the ones we release in ECT. Once they’re integrated, the same energy works for you. Anger becomes passion. Fear becomes excitement.</span></div>
<div class="pp2">
<div class="ppc in"><span class="hand">Unintegrated</span><h3>Held in, working against you</h3><p>The emotion was never fully felt, so it’s still in your body. You push it down, replay it or avoid it, and it leaks out sideways: snapping, shutting down, overthinking, a mood you can’t shake. It runs you, often without you knowing.</p></div>
<div class="ppc out"><span class="hand">Integrated</span><h3>Released, working for you</h3><p>The emotion has been felt all the way through and let go. It still visits, but it moves through in waves instead of stacking up, and its energy is yours to use as fuel. You run it.</p></div>
</div>
<div class="chips" role="group" aria-label="Pick an emotion"><sc-for list="{{enChips}}" as="o" hint-placeholder-count="7"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><img src="{{o.img}}" alt="">{{o.l}}</button></sc-for></div>
<div class="seriesbox" aria-live="polite"><span class="hand" style="font-size: 17px; color: #A8231F">{{enSerHead}}</span><div class="series"><sc-for list="{{enSeries}}" as="sr" hint-placeholder-count="4"><figure class="sfig"><img src="{{sr.img}}" alt="{{sr.alt}}"><figcaption><span class="sk">{{sr.k}}</span><strong>{{sr.n}}</strong><span>{{sr.cap}}</span></figcaption></figure></sc-for></div></div>
<div class="esc" aria-live="polite"><span class="hand" style="font-size: 17px; color: #A8231F">If it’s left unprocessed, it grows</span><div class="escrow"><sc-for list="{{enEsc}}" as="x" hint-placeholder-count="3"><span class="escp" style="background: {{x.bg}}; color: {{x.fg}}">{{x.n}}</span></sc-for></div><p>{{enEscT}}</p></div>

<!-- ================= 2 · ROOT & FLAVOUR ================= -->
<sc-if value="{{tabRoots}}" hint-placeholder-val="{{ false }}">

<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">Root or flavour?</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>The emotion is the dish. The state is the flavour.</p></div>
<p class="lead">An <strong>emotion</strong> is the root: one of the Big 7. A <strong>state</strong> is the flavour it shows up as in a moment. Think of it like food. Fear is the pizza. Anxiety, worry, overwhelm and insecurity are all flavours of pizza: pepperoni, margherita, the supreme. Different toppings, still pizza.</p>
<div class="pairs light">
<div class="pair"><span class="ps1">Anxiety</span><span class="ps2">is a flavour of</span><span class="ps1">fear.</span></div>
<div class="pair"><span class="ps1">Frustration</span><span class="ps2">is a flavour of</span><span class="ps1">anger.</span></div>
<div class="pair"><span class="ps1">Loneliness</span><span class="ps2">is a flavour of</span><span class="ps1">sadness.</span></div>
<div class="pair"><span class="ps1">Imposter syndrome</span><span class="ps2">is a flavour of</span><span class="ps1">shame.</span></div>
</div>
<p class="lead">Why it matters: you can’t release a flavour. You release the dish underneath it. Name the root, and you know which blueprint to open and what it really needs.</p>
<div class="callout cream"><span><strong>Your mind library.</strong> Every memory you have is filed with an emotion tag on it, like an emoji sticker on a book. The strongest tags are the ones your brain holds onto, because its job is to protect you: fear, shame, guilt, anger, sadness. Those tags are the roots, not the flavours.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>Emotions are information, not instructions.</p></div>
<div class="navrow"><sc-if value="{{lx.roots.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.roots.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.roots.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.roots.toggle}}">Hide the lesson</button></sc-if></div>

<!-- ================= EMOTIONAL MENU (draft) ================= -->
<sc-if value="{{tabMenu}}" hint-placeholder-val="{{ false }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Draft · Energy + Root &amp; flavour in one</span><p class="big">The emotional menu.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Emotions are energy in motion. Every main emotion is the dish, every feeling you have is a flavour of one, and every one of them can be transmuted into something new.</p></div>
<div class="howread">
<div class="hr1"><span class="sw" style="background: #D3302B"></span><span><strong>The middle is the main emotion.</strong> The Big 7 we release in ECT, plus joy and love.</span></div>
<div class="hr1"><span class="sw" style="background: #EE9E9B"></span><span><strong>Moving outward are its flavours.</strong> The louder ones first, then the quieter ones. They all link back to the middle.</span></div>
<div class="hr1"><span class="sw dash"></span><span><strong>The dotted line is integration.</strong> ECT for the Big 7. For joy and love, it’s letting them flow.</span></div>
<div class="hr1"><span class="sw" style="background: #F9E3E2; border: 1.5px solid #4E0C08"></span><span><strong>The outer ring is what that energy becomes</strong> once it’s integrated.</span></div>
</div>
<div class="callout lime"><span><strong>Joy or happiness?</strong> Joy is the emotion. Happiness is one of its flavours, the everyday version. And joy and love can be held back too: dimmed, guarded, or not let in. Even “good” emotions need to move.</span></div>
</section>

<!-- ================= 4 · FEELINGS WHEEL ================= -->
<sc-if value="{{tabWheel}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.wheel.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">Name it to move it.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Naming the emotion makes it easier to move through.</p></div>
<p class="lead">When you’re in fight or flight, putting a label on what you feel reconnects your thinking mind with your survival mind, and gives you more resources to handle what’s happening. And once you know you’re safe, you’re allowed to let yourself feel it fully.</p>
<p class="lead">This is why everything here starts in your body. Here’s how it flows:</p>
<div class="flow">
<div class="fstep"><span class="fn">1</span><strong>Feel it</strong><span>What do I feel in my body?</span></div>
<div class="fstep"><span class="fn">2</span><strong>Name it</strong><span>The feelings wheel helps you put a label on it.</span></div>
<div class="fstep"><span class="fn">3</span><strong>Process it</strong><span>What am I feeling? helps you let it move.</span></div>
<div class="fstep"><span class="fn">4</span><strong>Reframe it</strong><span>Once it’s moved, changing the meaning is easier.</span></div>
<div class="fstep"><span class="fn">5</span><strong>Change it</strong><span>And choosing what you do next gets simpler too.</span></div>
</div>
<p class="lead">Every emotion comes with a thought, a feeling in your body, and a behaviour. They feed each other in a loop: a thought sparks a feeling, the feeling drives a behaviour, the behaviour proves the thought. Round and round.</p>
<div class="tfd" aria-label="The Think, Feel, Do loop">
<div class="tfdc"><span class="hand">Think</span><strong>“They’re ignoring me.”</strong><span>What you tell yourself</span></div>
<span class="tfda" aria-hidden="true">→</span>
<div class="tfdc"><span class="hand">Feel</span><strong>Heavy chest, lump in throat</strong><span>What happens in your body</span></div>
<span class="tfda" aria-hidden="true">→</span>
<div class="tfdc"><span class="hand">Do</span><strong>Go quiet, pull away</strong><span>What it makes you do</span></div>
<span class="tfda" aria-hidden="true">↺</span>
</div>
<div class="callout lime"><span><strong>Meet the feelings wheel.</strong> It maps the whole loop. Start in the middle with the emotion, then work outwards: each emotion shows up as a <strong>state</strong>, which comes with a <strong>thought</strong>, a <strong>feeling</strong> in your body and a <strong>behaviour</strong>. Spot any one of them, and you can trace it back to the root.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>Naming it turns the volume down.</p></div>
<div class="navrow"><sc-if value="{{lx.wheel.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.wheel.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.wheel.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.wheel.toggle}}">Hide the lesson</button></sc-if></div>
</section>
</sc-if>

<section class="toolsec" id="tool-wheel">
<div class="toolhead"><span class="tk">The tool</span><h2 class="h2">The feelings wheel.</h2><p><strong>What it’s for:</strong> putting a name to what you feel. <strong>How to use it:</strong> start with what you notice (a thought, a body feeling, or something you did), find it on the wheel and tap it to trace it back to its emotion. Or search for it below.</p></div>
<div class="search">
<label class="sl" for="eb-search-guide">What are you wondering about?</label>
<input id="eb-search-guide" class="input" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Try “lump in my throat”, “frustration”, “hips”…">
<sc-if value="{{hasResults}}" hint-placeholder-val="{{ false }}"><div class="sres"><sc-for list="{{results}}" as="r" hint-placeholder-count="4"><button class="sr" onClick="{{r.pick}}"><span class="sd" style="background: {{r.col}}"></span><span>{{r.l}}</span><span class="sk2">{{r.k}}</span></button></sc-for></div></sc-if>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><p class="hn">Nothing matches that yet. Try a body part, or a word like “worried” or “heavy”.</p></sc-if>
</div>
<section class="sec">
<div class="eyebrow">The Big 7</div>
<h2 class="h2">The seven emotions we release in ECT.</h2>
<p class="lead">These are the seven most impactful emotions, and the ones we work on together. Almost every feeling you’ll ever have has one of these at its root.</p>
<div class="callout lime"><span><strong>The Think · Feel · Do wheel.</strong> Start in the middle with the emotion, then work outwards. Each emotion shows up as a <strong>state</strong>, which comes with a <strong>thought</strong> (what you tell yourself), a <strong>feeling</strong> in your body, and a <strong>behaviour</strong> (what you do). Spot any one of them, and you can trace it back to the root. Tap a face or a state to open it.</span></div>
<div class="rings" aria-hidden="true"><span class="rg" style="background: #D3302B; color: #FFFFFF">Emotion</span><span class="ra">→</span><span class="rg" style="background: #F2B3AC">State</span><span class="ra">→</span><span class="rg" style="background: #F6C9C4">Think</span><span class="ra">→</span><span class="rg" style="background: #F9DAD6">Feel</span><span class="ra">→</span><span class="rg" style="background: #FCEAE8">Do</span></div>
<div class="wheelwrap">
<img src="/tools/assets/405b3bf884136aaf14d362ee919d81a0.svg" alt="Think, Feel, Do wheel: the seven core emotions in the centre, each with four states, and for each state a typical thought, body feeling and behaviour around the outside.">
<sc-for list="{{wheelBtns}}" as="w" hint-placeholder-count="35"><button class="{{w.cls}}" style="left: {{w.x}}%; top: {{w.y}}%" aria-label="{{w.l}}" onClick="{{w.pick}}"></button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center"><a class="ghost solid" href="/tools/assets/42148b886659a14145d923ab0ee21137.png" download="think-feel-do-wheel.png" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Download the wheel to print or save</a></div>
<div class="b7s"><sc-for list="{{b7Cards}}" as="e" hint-placeholder-count="7"><button class="b7" style="border-top-color: {{e.col}}" onClick="{{e.pick}}"><span class="br"><img src="{{e.img}}" alt=""><span class="bn7">{{e.n}}</span></span><span class="bd">{{e.dir}}</span><span class="bst">{{e.states}}</span></button></sc-for></div>
</section>
<div class="qblock">
<h3>Practice: catch one loop</h3>
<p class="bodycue">Think of a moment from today or yesterday that stirred something up. Start with your body.</p>
<label class="lbl" for="l4-feel">What did I feel in my body?</label><input id="l4-feel" class="input" type="text" value="{{l4F}}" onChange="{{onL4F}}" placeholder="Tight chest, hot face, lump in my throat…">
<sc-if value="{{hasL4Labels}}" hint-placeholder-val="{{ false }}"><div class="labelhelp" aria-live="polite"><span class="mrh">Your body might be telling you it’s</span><div class="chips"><sc-for list="{{l4Labels}}" as="e" hint-placeholder-count="2"><button class="chip small" onClick="{{e.pick}}"><img src="{{e.img}}" alt="">{{e.l}}</button></sc-for></div></div></sc-if>

<sc-if value="{{l4Done}}" hint-placeholder-val="{{ false }}"><p class="mine-quote">{{l4Loop}}</p></sc-if>
<p class="bodycue">Got a name for it? Now let it move. What am I feeling? walks you through processing it, step by step.</p>
<button class="primary maroon" style="align-self: flex-start" onClick="{{go.tune}}">Open What am I feeling?</button>
</div>
</section>

<!-- ================= 5 · WHAT AM I FEELING ================= -->
<sc-if value="{{tabTune}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.tune.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">What am I feeling?</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>You don’t need to know why. You just need to notice, then name it.</p></div>
<p class="lead">When you can’t tell what you’re feeling, it’s usually because you’re up in your head. What am I feeling? walks you back down into your body, one step at a time: a brain dump to get it out of your head, what you feel and where, its shape, colour and temperature, a name for it, and what it needs.</p>
<div class="pp2">
<div class="ppc out"><span class="hand">When to use it</span><h3>Something knocked</h3><p>You’re off, snappy, flat or teary and not sure why. Or you know something happened, but can’t put a word to it. Give it about ten minutes.</p></div>
<div class="ppc out"><span class="hand">What happens after</span><h3>It saves to your blueprint</h3><p>Every check-in is sorted by emotion and added to your blueprints, so over time you can see your own patterns.</p></div>
</div>
<div class="callout lime"><span><strong>Each step starts with a drop-in.</strong> A breath, a softening, a moment to feel. That’s the bit that brings you back into your body, so don’t skip it.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>You don’t have to understand a feeling to feel it.</p></div>
<div class="navrow"><sc-if value="{{lx.tune.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.tune.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.tune.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.tune.toggle}}">Hide the lesson</button></sc-if></div>
</section>

<!-- T1 BRAIN DUMP -->
<sc-if value="{{t0}}" hint-placeholder-val="{{ true }}">
<p class="lead">What happened? Write down how you’re feeling. Don’t try to make sense of it. Just note the feelings in your body, the trigger, how it made you feel: annoyed, angry, like you weren’t good enough.</p>
<label class="lbl" for="wf-trigger">What happened? (the trigger, in a line)</label>
<input id="wf-trigger" class="input" type="text" value="{{c.what}}" onChange="{{onWhat}}" placeholder="He said it in front of everyone…">
<label class="lbl" for="wf-dump">Big ass brain dump</label>
<textarea id="wf-dump" class="input tall" value="{{c.dump}}" onChange="{{onDump}}" placeholder="Just keep writing. Messy is perfect."></textarea>
<div class="qblock">
<h3>How did that make you feel?</h3>
<p class="qh">Use your own words if you want, and we’ll find the feeling for you. Or choose what you feel fits from the wheel below.</p>
<input id="wf-fw" class="input" type="text" value="{{c.feelWords}}" onChange="{{onFeelWords}}" placeholder="Like I wasn’t good enough, kind of pissed off…">
<sc-if value="{{tfHasHits}}" hint-placeholder-val="{{ false }}"><span class="mrh">Sounds like this. Tap the ones that fit</span><div class="chips"><sc-for list="{{tfHits}}" as="h" hint-placeholder-count="2"><button class="{{h.cls}}" onClick="{{h.pick}}"><span class="dotc" style="background: {{h.col}}"></span>{{h.l}}</button></sc-for></div></sc-if>
<sc-if value="{{tfHasSit}}" hint-placeholder-val="{{ false }}"><span class="mrh">That sounds like what happened. If you were to know, how did it make you feel?</span><div class="chips"><sc-for list="{{tfSit}}" as="h" hint-placeholder-count="4"><button class="{{h.cls}}" onClick="{{h.pick}}"><span class="dotc" style="background: {{h.col}}"></span>{{h.l}}</button></sc-for></div></sc-if>
<sc-if value="{{tfHasPicked}}" hint-placeholder-val="{{ false }}"><span class="mrh">You picked</span><div class="chips"><sc-for list="{{tfPicked}}" as="h" hint-placeholder-count="2"><button class="chip small on" onClick="{{h.pick}}"><span class="dotc" style="background: {{h.col}}"></span>{{h.l}}</button></sc-for></div></sc-if>
<div class="wheelwrap pwheel"><img src="/tools/assets/155c64712190eac9be159d6ad01d6e35.svg" alt="The Energy in Motion wheel. Tap any feeling that fits.">
<sc-for list="{{tfHl}}" as="h" hint-placeholder-count="2"><span class="{{h.cls}}" style="left: {{h.x}}%; top: {{h.y}}%" aria-hidden="true"></span></sc-for>
<sc-for list="{{tfBtns}}" as="w" hint-placeholder-count="126"><button class="{{w.cls}}" style="left: {{w.x}}%; top: {{w.y}}%" aria-label="{{w.l}}" onClick="{{w.pick}}"></button></sc-for></div>
<p class="hn" style="margin: 0">Not sure yet? That’s fine. Leave it, and we’ll work it out through your body in the next few steps.</p>
</div>
<div class="callout lime"><svg width="22" height="22" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span><strong>Write until you feel like you’ve gotten it all out.</strong> That is the act of being in your body. If you catch yourself analysing, pause, breathe, and come back to the feeling. Writing takes it out of your head, where you ruminate, and lets your unconscious come online and into your body.</span></div>
</sc-if>

<!-- T2 IN YOUR BODY -->
<sc-if value="{{t1}}" hint-placeholder-val="{{ false }}">
<p class="lead">Don’t worry about naming the emotion yet. Just describe what you’re experiencing. Your body often knows what you’re feeling long before your conscious mind catches up.</p>
<div class="qblock">
<h3>What does it feel like in your body?</h3>
<p class="bodycue">Breathe into it. Is it still, or moving? Tight, or loose? Heavy, or buzzing?</p>

</div>
<div class="qblock">
<h3>Where do you feel it?</h3>
<p class="bodycue">Scan slowly from your head down to your feet. Where does it get louder? Tap those spots.</p>
<div class="body-wrap">
<div class="bodymap">
<svg width="260" height="484" viewBox="0 0 260 484" aria-hidden="true"><circle cx="130" cy="52" r="36" fill="#F6E3F7"></circle><path d="M130 86V142" stroke="#F6E3F7" stroke-width="28" stroke-linecap="round"></path><path d="M78 146Q130 128 182 146L174 302Q130 316 86 302Z" fill="#F6E3F7"></path><path d="M82 150Q54 160 46 218L36 322" fill="none" stroke="#F6E3F7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path><path d="M178 150Q206 160 214 218L224 322" fill="none" stroke="#F6E3F7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"></path><path d="M108 304L100 466M152 304L160 466" fill="none" stroke="#F6E3F7" stroke-width="32" stroke-linecap="round"></path></svg>
<sc-for list="{{bodySpots}}" as="b" hint-placeholder-count="10"><button class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}"><span class="pd"></span>{{b.l}}</button></sc-for>
</div>
<div class="wherecol">
<span class="lbl">Also…</span>
<div class="chips"><sc-for list="{{whereExtra}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{o.l}}</button></sc-for></div>
<span class="lbl">I feel it in my…</span>

<sc-if value="{{hasBodyHints}}" hint-placeholder-val="{{ false }}"><div class="callout cream" style="flex-direction: column; gap: 8px"><span><strong>Curious what it might be holding?</strong> Tap a spot to see the emotions it’s often linked with.</span><div class="chips"><sc-for list="{{bodyHints}}" as="h" hint-placeholder-count="2"><button class="chip small" onClick="{{h.pick}}"><span class="dotc" style="background: {{h.col}}"></span>{{h.l}}</button></sc-for></div></div></sc-if>

<!-- T3 PICTURE IT -->
<sc-if value="{{t2}}" hint-placeholder-val="{{ false }}">
<p class="lead">Now let’s give it a form. Go with the first thing that pops up. There are no wrong answers here, only clues.</p>
<div class="qblock">
<h3>If it had a shape, what would it be?</h3>
<p class="bodycue">Put your attention right on that spot. Does it have edges? Is it growing, or shrinking?</p>
<div class="chips"><sc-for list="{{shapeChips}}" as="o" hint-placeholder-count="12"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{o.l}}</button></sc-for></div>

<div class="qblock">
<h3>If it had a colour, what would it be?</h3>

<div class="chips"><sc-for list="{{colourChips}}" as="o" hint-placeholder-count="12"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="sw" style="background: {{o.hex}}"></span>{{o.l}}</button></sc-for></div>

</div>
<div class="qblock">
<h3>If it had a temperature, what would it be?</h3>
<p class="bodycue">Notice your skin, your face, your chest. Warmer than usual, or colder?</p>
<div class="temps" role="group" aria-label="Temperature"><sc-for list="{{tempBtns}}" as="t" hint-placeholder-count="6"><button class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}"><span class="tbar" style="background: {{t.hex}}"></span>{{t.l}}</button></sc-for></div>
</div>
<div class="qblock">
<h3>If it were a force of nature, what would it be?</h3>
<p class="bodycue">Let the feeling show you what it would be out in the world. Feel it, then pick.</p>
<div class="chips"><sc-for list="{{forceChips}}" as="o" hint-placeholder-count="12"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="radio"><span></span></span>{{o.l}}</button></sc-for></div>
<label class="lbl" for="wf-force">Mine would be <strong>{{forceName}}</strong> because…</label>
<input id="wf-force" class="input" type="text" value="{{c.forceWhy}}" onChange="{{onForceWhy}}" placeholder="the more fuel you give it, the bigger it gets">
</div>
</sc-if>

<!-- T4 THE URGE -->
<sc-if value="{{t3}}" hint-placeholder-val="{{ false }}">
<p class="lead">Every emotion comes with an urge. It’s your body telling you what it needs to do to let the feeling move through. You don’t have to act on it. Just be honest about it.</p>
<div class="qblock">
<h3>What does your body want to do?</h3>
<p class="bodycue">Let your body move a little as you read these. Your hands, your jaw, your legs. Which one makes your body go “yes”?</p>
<div class="chips"><sc-for list="{{urgeChips}}" as="o" hint-placeholder-count="16"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{o.l}}</button></sc-for></div>
</div>
<div class="qblock">
<label class="lbl big2" for="wf-not">What do you feel like doing that you aren’t allowing yourself to do?</label>
<textarea id="wf-not" class="input" value="{{c.notAllowed}}" onChange="{{onNotAllowed}}" placeholder="I want to scream and get it out of me, but I’m at work so I’m sitting here smiling…"></textarea>
</div>
</sc-if>

<!-- T5 NAME IT -->
<sc-if value="{{t4}}" hint-placeholder-val="{{ false }}">
<p class="hand" style="margin: 0; font-size: 16px; color: #A8231F">Here’s what you described</p>
<p class="{{recapCls}}">{{recap}}</p>
<p class="lead">Read that back slowly. Then, based on everything you just described, which emotion feels closest? Pick one, or a few. Emotions love to travel in packs.</p>
<div class="callout cream"><span>The little “clue” tags show where your answers match how that emotion often shows up. They’re clues, not a diagnosis. Everyone experiences emotions differently, and your body knows best.</span></div>
<div class="emos"><sc-for list="{{emoCards}}" as="e" hint-placeholder-count="7"><button class="{{e.cls}}" aria-pressed="{{e.pressed}}" onClick="{{e.pick}}"><span class="er"><img src="{{e.img}}" alt=""><span class="en">{{e.n}}</span><span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span><span class="es">{{e.s}}</span><sc-if value="{{e.hasMatch}}" hint-placeholder-val="{{ false }}"><span class="em">{{e.match}}</span></sc-if></button></sc-for></div>
<label class="lbl" for="wf-other">Something else?</label>
<input id="wf-other" class="input" type="text" value="{{c.emoOther}}" onChange="{{onEmoOther}}" placeholder="Jealousy, loneliness, disappointment, overwhelm…">
</sc-if>

<!-- T6 WHAT DO YOU NEED -->
<sc-if value="{{t5}}" hint-placeholder-val="{{ false }}">
<div class="qblock">
<h3>How big is it, right now?</h3>
<div class="scale" role="group" aria-label="How big is the feeling, 1 to 10"><sc-for list="{{tScale}}" as="n" hint-placeholder-count="10"><button class="{{n.cls}}" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.n}}</button></sc-for></div>
<div class="scl"><span>A whisper</span><span>Taking over</span></div>
</div>
<p style="margin: 0; font-weight: 600; font-size: 16px">So, what do you need?</p>
<div class="paths" role="group" aria-label="What do you need"><sc-for list="{{pathBtns}}" as="p" hint-placeholder-count="3"><button class="{{p.cls}}" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}"><img src="{{p.img}}" alt=""><span class="pt">{{p.t}}</span><span class="ps">{{p.s}}</span></button></sc-for></div>
<sc-if value="{{showFirstPick}}" hint-placeholder-val="{{ false }}">
<div class="qblock">
<h3>Which one wants to go first?</h3>
<p class="bodycue">Feel into each one. Which is loudest in your body right now?</p>
<div class="chips"><sc-for list="{{firstChips}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><img src="{{o.img}}" alt="">{{o.l}}</button></sc-for></div>
</div>
</sc-if>
<sc-if value="{{noEmoWarn}}" hint-placeholder-val="{{ false }}"><div class="callout"><span>To process it, go back one step and pick the emotion that feels closest, even if it’s just a guess.</span></div></sc-if>
</sc-if>

<!-- T7 SMALL WAY -->
<sc-if value="{{t6}}" hint-placeholder-val="{{ false }}">
<p class="lead">If you can’t do the things your body is asking for right now, what could you do that might help? You don’t always need a big external reaction. You just need to sit with the feeling and move it through your body.</p>
<p class="hand" style="margin: 0; font-size: 16px; color: #A8231F">{{needsKicker}}</p>
<div class="needs"><sc-for list="{{needCards}}" as="n" hint-placeholder-count="6"><button class="{{n.cls}}" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}"><img src="{{n.img}}" alt=""><span><span class="nk">{{n.k}}</span>{{n.t}}</span><span class="tk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></button></sc-for></div>
<div class="qblock">
<label class="lbl big2" for="wf-small">How can I meet this need in a small way, now?</label>
<textarea id="wf-small" class="input" value="{{c.smallOwn}}" onChange="{{onSmallOwn}}" placeholder="Go sit in the car for five minutes and let myself cry…"></textarea>
</div>
</sc-if>

<!-- T8 INTENTIONAL PAUSE -->
<sc-if value="{{t7}}" hint-placeholder-val="{{ false }}">
<p class="lead">You couldn’t deal with it in the moment, and that’s okay. When it pops back up later (the thought, the event, or just that same feeling), that’s your chance to put intention into processing it.</p>
<div class="moments">
<div class="moment"><span class="mh">In the shower</span><p>After a long day you might just feel like crying. So cry. You don’t need to know why. It’s your nervous system saying “we need this right now”.</p></div>
<div class="moment"><span class="mh">In the car</span><p>About to walk into the gym after school drop-off, and the feeling comes back up? Process it properly, right there.</p></div>
<div class="moment"><span class="mh">Any pause in your day</span><p>It’s often when you pause and let your brain and body re-sync that the unprocessed feeling pops up. That pause is a gift.</p></div>
</div>
<div class="callout lime"><span><strong>This is what we mean by “sit with your feelings”.</strong> Ride the wave, and let yourself fulfil the need your body is telling you is going unmet. When you’re ready, open this feeling from My blueprints and process it fully.</span></div>
<div class="little">
<img src="/tools/assets/b8d6cf789c3b52fd6c8e25329142b20f.svg" alt="">
<div class="lt">
<span class="hand" style="font-size: 16px; color: #A8231F">Little me</span>
<p>It helps me to imagine my unconscious brain as little Sav. She’s little me, who was hurting or couldn’t make sense of the world, and it’s my job to release the feelings so she can feel safe again. When my brain alerts me that there’s sadness, I think about little Sav, who must be sad, and I process it for her. Bit by bit, I relieve that pain.</p>
<p class="lq">She’s the person I was gifted to take care of, and by taking care of her, I heal myself at the same time.</p>
</div>
</div>
<div class="qblock">
<label class="lbl big2" for="wf-little">What does little me need right now?</label>
<input id="wf-little" class="input" type="text" value="{{c.littleMe}}" onChange="{{onLittleMe}}" placeholder="To be held. To hear that it wasn’t their fault.">
</div>
</sc-if>

<div class="navrow">
<sc-if value="{{tShowNext}}" hint-placeholder-val="{{ true }}"><button class="primary maroon" onClick="{{tNext}}">{{tNextLabel}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></sc-if>
<sc-if value="{{tShowSave}}" hint-placeholder-val="{{ false }}"><button class="primary" onClick="{{tSave}}">{{tSaveLabel}}</button></sc-if>
<button class="{{tResetCls}}" onClick="{{tReset}}">{{tResetLabel}}</button>
</div>
</section>
</sc-if>
</div>

</sc-if>

<!-- ================= 6 · BLENDS ================= -->
<sc-if value="{{tabBlends}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.blends.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">Feelings rarely come alone.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>When a feeling is hard to name, it’s often two emotions at once.</p></div>
<p class="lead">Two emotions at once blend into something new, and that’s often why a feeling is so hard to put a word to. It’s not one thing. It’s two.</p>
<div class="pairs light">
<div class="pair"><span class="ps1">Hurt + anger</span><span class="ps2">=</span><span class="ps1">resentment</span></div>
<div class="pair"><span class="ps1">Fear + shame</span><span class="ps2">=</span><span class="ps1">exposure</span></div>
<div class="pair"><span class="ps1">Grief + love</span><span class="ps2">=</span><span class="ps1">tender grief</span></div>
<div class="pair"><span class="ps1">Shame + love</span><span class="ps2">=</span><span class="ps1">loved anyway</span></div>
</div>
<div class="callout"><span><strong>Old feelings blend with new ones too.</strong> Today’s anger often has old hurt sitting underneath it. That’s what stacking feels like (more on that in lesson 8). Process the louder one first, and the other usually softens too.</span></div>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>Name both, and both get lighter.</p></div>
<div class="navrow"><sc-if value="{{lx.blends.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.blends.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.blends.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.blends.toggle}}">Hide the lesson</button></sc-if></div>
</section>
</sc-if>
<sc-if value="{{lx.blends.closed}}" hint-placeholder-val="{{ false }}"><div class="lbar"><span class="lbadge sm">✦</span><span class="lbt"><strong>Feelings rarely come alone</strong> · lesson done</span><button class="ghost" onClick="{{lx.blends.toggle}}">Read the lesson again</button></div></sc-if>
<section class="toolsec" id="tool-blends">
<div class="toolhead"><span class="tk">The tool</span><h2 class="h2">The emotion mixer.</h2><p><strong>What it’s for:</strong> naming a feeling that’s really two at once. <strong>How to use it:</strong> pick the two emotions that feel closest and see what they make. Pick the same one twice to turn it up, or tap any square in the grid. Want every level of consciousness mixed together? The full mixer lives in tab 7.</p></div>
<section class="sec">
<div class="eyebrow">Emotion mixer</div>
<h2 class="h2">Feelings rarely come alone.</h2>
<p class="lead">Two emotions at once blend into something new. Hurt plus anger becomes resentment. Fear plus shame becomes that terrified-to-be-found-out feeling. Pick two and see what they make. Pick the same one twice to turn it up.</p>
<div class="mixer">
<div class="mixcol"><span class="lbl">First feeling</span><div class="chips"><sc-for list="{{mixA}}" as="o" hint-placeholder-count="7"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><img src="{{o.img}}" alt="">{{o.l}}</button></sc-for></div></div>
<div class="mixcol"><span class="lbl">Plus</span><div class="chips"><sc-for list="{{mixB}}" as="o" hint-placeholder-count="7"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><img src="{{o.img}}" alt="">{{o.l}}</button></sc-for></div></div>
</div>

<span class="hand" style="font-size: 16px; color: #A8231F">{{mixKicker}}</span>
<p class="big" style="font-size: clamp(26px, 4.6vw, 34px)">{{mixName}}</p>
<p class="body" style="color: #1F1412">{{mixDesc}}</p>
<p class="mixq">“{{mixThought}}”</p>
</div>
</div>
<p class="hand" style="margin: 0; font-size: 17px; color: #A8231F">Every blend at a glance · tap any square</p>
<div class="bgrid-wrap">
<div class="bgrid">
<span class="bgh"></span>
<sc-for list="{{gridHead}}" as="h" hint-placeholder-count="7"><span class="bgh"><img src="{{h.img}}" alt="">{{h.n}}</span></sc-for>

</sc-for>
</div>
</div>
</section>
</section>
<div class="navrow"><button class="ghost" onClick="{{go.home}}">← Home</button><button class="ghost solid" onClick="{{go.eim}}">The Energy in Motion wheel →</button></div>
</sc-if>

<!-- ================= 7 · CONSCIOUSNESS ================= -->
<sc-if value="{{tabLevels}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{lx.levels.open}}" hint-placeholder-val="{{ true }}">
<section class="lesson">
<div class="lhead"><span class="lbadge">✦</span><div><span class="hand" style="font-size: 16px; color: #A8231F">Quick lesson</span><p class="big">The Map of Consciousness.</p></div></div>
<div class="bigidea"><span class="hand" style="font-size: 15px; color: #F1F9A6">The big idea</span><p>Below Courage, an emotion is held and running you. Above it, the same energy has been released, and you’re running it.</p></div>
<p class="lead"><strong>Dr David R. Hawkins</strong> was a psychiatrist and researcher. In his book <em>Power vs. Force</em> (1995) he shared the Map of Consciousness: a scale that gives every emotional state a number, from Shame at 20 up to Enlightenment at 700 and beyond, for how much energy it carries. You’ll often see these numbers shared online as frequencies, or “Hz”.</p>
<div class="pp2">
<div class="ppc in"><span class="hand">The lower the number</span><h3>Energy contracts</h3><p>The emotion drains you. Your energy goes into protecting, defending, hiding or attacking.</p></div>
<div class="ppc out"><span class="hand">The higher the number</span><h3>Energy expands</h3><p>The emotion fuels you. Your energy flows out into living, loving and creating.</p></div>
</div>
<p class="lead">The big line is <strong>Courage at 200</strong>. Here’s what it means for the Big 7:</p>
<div class="map">
<div class="zone up"><span class="zk">Above 200 · integrated and released</span><span>The emotion has been felt and let go, like through ECT. Its energy is free.</span></div>
<sc-for list="{{mapTop}}" as="l" hint-placeholder-count="8"><button class="{{l.cls}}" style="background: {{l.col}}" onClick="{{l.pick}}"><span class="lnum">{{l.n}}</span><span class="lname"><strong>{{l.name}}</strong><span>{{l.sub}}</span></span><sc-if value="{{l.hasTag}}" hint-placeholder-val="{{ false }}"><span class="ltag up">{{l.tag}}</span></sc-if></button></sc-for>
<div class="courage"><span class="cnum">200</span><span><strong>Courage · the tipping point</strong>Everything below this line is held. Everything above it is released. Released anger rises here first.</span></div>
<sc-for list="{{mapBottom}}" as="l" hint-placeholder-count="8"><button class="{{l.cls}}" style="background: {{l.col}}" onClick="{{l.pick}}"><span class="lnum">{{l.n}}</span><span class="lname"><strong>{{l.name}}</strong><span>{{l.sub}}</span></span><sc-if value="{{l.hasTag}}" hint-placeholder-val="{{ false }}"><span class="ltag">{{l.tag}}</span></sc-if></button></sc-for>
<div class="zone down"><span class="zk">Below 200 · unintegrated and held</span><span>The emotion is stuck in your body, pushed down or replayed. Its energy is tied up protecting you.</span></div>
</div>
<div class="callout lime"><span><strong>Take anger.</strong> Anger at 150, below the line, is unintegrated anger: the resentment you replay, the fire you keep feeding. When it’s released, that same energy rises above the line and becomes courage, passion and healthy boundaries.</span></div>
<p class="hand" style="margin: 0; font-size: 18px; color: #A8231F">Where each of the Big 7 rises to when it’s released</p>
<div class="rises"><sc-for list="{{rises}}" as="r" hint-placeholder-count="7"><div class="rise" style="border-left-color: {{r.col}}"><img src="{{r.img}}" alt=""><span class="rfrom"><strong>{{r.n}}</strong>{{r.from}}</span><span class="rarrow" aria-hidden="true">→</span><span class="rto"><strong>{{r.to}}</strong>{{r.gift}}</span></div></sc-for></div>
<p class="hn">Hurt and sadness didn’t get their own level on Hawkins’ map. They live with Grief at 75, and sadness can sink lower, into Apathy at 50, when it turns flat and hopeless. The “rises to” levels are a guide, not a rule.</p>
<div class="truthbox"><span class="hand" style="font-size: 15px; color: #A8231F">The truth to take with you</span><p>Every rung up counts. Even shame to anger is progress.</p></div>
<div class="navrow"><sc-if value="{{lx.levels.notDone}}" hint-placeholder-val="{{ true }}"><button class="primary" onClick="{{lx.levels.done}}">Got it · show me the tool</button></sc-if><sc-if value="{{lx.levels.isDone}}" hint-placeholder-val="{{ false }}"><button class="ghost solid" onClick="{{lx.levels.toggle}}">Hide the lesson</button></sc-if></div>
</section>
</sc-if>
<sc-if value="{{lx.levels.closed}}" hint-placeholder-val="{{ false }}"><div class="lbar"><span class="lbadge sm">✦</span><span class="lbt"><strong>The Map of Consciousness</strong> · lesson done</span><button class="ghost" onClick="{{lx.levels.toggle}}">Read the lesson again</button></div></sc-if>
<div class="toolsec" id="tool-levels">
<div class="toolhead"><span class="tk">The tools</span><h2 class="h2">The mega wheel, every level, and the full mixer.</h2><p><strong>What they’re for:</strong> going deeper with every level of the map. <strong>How to use them:</strong> tap any level or state on the wheel to open it, climb the levels to see how to rise to the next one, or mix any two levels together.</p></div>
<section class="sec">
<p class="big">The mega wheel.</p>
<p class="lead">Every level of the Map of Consciousness, from Shame at 20 all the way up to Enlightenment at 700+, with the states that live at each level and how they show up in your thoughts, your body and your behaviour.</p>
<div class="callout lime"><span><strong>How to read it.</strong> The levels go clockwise from the lowest energy to the highest. The dashed line marks Courage at 200: below it, energy contracts; above it, energy expands. A yellow <strong>7</strong> marks the Big 7 we release in ECT (sadness and hurt live inside Grief). Tap any level or state to open it.</span></div>
<div class="rings" aria-hidden="true"><span class="rg" style="background: #E07F73">Level</span><span class="ra">→</span><span class="rg" style="background: #EEB2AA">State</span><span class="ra">→</span><span class="rg" style="background: #F4CBC5">Think</span><span class="ra">→</span><span class="rg" style="background: #F9E1DE">Feel</span><span class="ra">→</span><span class="rg" style="background: #FCF0EE">Do</span></div>
<div class="wheelwrap mega">
<img src="/tools/assets/7205741504b90f111c0451fab85ff2d3.svg" alt="The emotional mega wheel: 17 levels of the Map of Consciousness from Shame to Enlightenment, each with three states and a typical thought, body feeling and behaviour for each.">
<sc-for list="{{megaBtns}}" as="w" hint-placeholder-count="68"><button class="{{w.cls}}" style="left: {{w.x}}%; top: {{w.y}}%" aria-label="{{w.l}}" onClick="{{w.pick}}"></button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center"><a class="ghost solid" href="/tools/assets/738ba7703ba55beb0d52acfc42beea68.png" download="emotional-mega-wheel.png" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Download the mega wheel</a></div>
</section>

<section class="sec">
<div class="eyebrow">Every level</div>
<h2 class="h2">Climb the map.</h2>
<p class="lead">Tap a level for what it is, what it’s telling you, its states, and how to rise to the next one.</p>
<div class="ladder2"><sc-for list="{{megaLevels}}" as="l" hint-placeholder-count="17">
<sc-if value="{{l.isDiv}}" hint-placeholder-val="{{ false }}"><div class="ldiv">Energy expands above · contracts below</div></sc-if>
<button class="{{l.cls}}" style="background: {{l.col}}" onClick="{{l.pick}}"><span class="lnum">{{l.hz}}</span><span class="lname"><strong>{{l.name}}</strong><span>{{l.sub}}</span></span><sc-if value="{{l.isB7}}" hint-placeholder-val="{{ false }}"><span class="ltag">{{l.tag}}</span></sc-if></button>
</sc-for></div>
</section>

<section class="sec">
<div class="eyebrow">The full mixer</div>
<h2 class="h2">Every emotion, blended with every other.</h2>
<p class="lead">All 17 levels, all 153 combinations. Mix a low one with a high one and you’ll often find the medicine: shame plus love becomes “loved anyway”.</p>
<div class="mixer">
<div class="mixcol"><span class="lbl">First feeling</span><div class="chips"><sc-for list="{{mmA}}" as="o" hint-placeholder-count="17"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="dotc" style="background: {{o.col}}"></span>{{o.l}}</button></sc-for></div></div>
<div class="mixcol"><span class="lbl">Plus</span><div class="chips"><sc-for list="{{mmB}}" as="o" hint-placeholder-count="17"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="dotc" style="background: {{o.col}}"></span>{{o.l}}</button></sc-for></div></div>
</div>
<div class="mixres" aria-live="polite">
<svg width="150" height="96" viewBox="0 0 150 96" aria-hidden="true" style="flex: none"><circle cx="52" cy="48" r="42" fill="{{mmColA}}" fill-opacity="0.8" stroke="#4E0C08" stroke-width="2"></circle><circle cx="98" cy="48" r="42" fill="{{mmColB}}" fill-opacity="0.8" stroke="#4E0C08" stroke-width="2"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 240px">
<span class="hand" style="font-size: 16px; color: #A8231F">{{mmKicker}}</span>
<p class="big" style="font-size: clamp(26px, 4.6vw, 34px)">{{mmName}}</p>
<p class="body" style="color: #1F1412">{{mmDesc}}</p>
<p class="mixq">“{{mmThought}}”</p>
</div>
</div>
<p class="hand" style="margin: 0; font-size: 17px; color: #A8231F">Every blend · scroll sideways · tap any square</p>
<div class="bgrid-wrap">
