<section class="wi-intro" data-tour="intro">
<button class="wi-intro-h" type="button" aria-expanded="{{introExp}}" onClick="{{toggleIntro}}"><span style="font-size: 22px" aria-hidden="true">🧭</span><b>When to come back to this</b><span class="wi-tg" aria-hidden="true">{{introSign}}</span></button>
<sc-if value="{{introOpen}}" hint-placeholder-val="{{ true }}">
<div class="wi-intro-b">
<p>This isn’t a one-off. It’s an activity to come back to whenever you find yourself:</p>
<ul class="wi-when">
<li>lying awake running “what if…” on a loop</li>
<li>dreading a phone call, an appointment or a conversation</li>
<li>replaying what someone might think of you, or what you said</li>
<li>frozen before starting something new or unfamiliar</li>
<li>anything fear, anxiety or worry related</li>
</ul>
<p><strong style="color: #1F1412">Start big, then chunk it down.</strong> Write the big scary what-if first. Then keep asking “what’s the smaller what-if underneath it?” until you reach one you can actually do something about today.</p>
<div class="wi-ex">
<div class="wi-ladder"><span class="wi-lk">An ADHD example</span>
<span class="wi-rung big">What if I lose my job?</span>
<span class="wi-rung">What if I miss Friday’s deadline?</span>
<span class="wi-rung">What if I can’t start the report today?</span>
<span class="wi-rung">What if I open it and just stare at the screen?</span>
<span class="wi-rung step">Do this: a 10-minute timer, and just write the headings.</span>
</div>
<div class="wi-ladder au"><span class="wi-lk">An autistic example</span>
<span class="wi-rung big">What if the party is too much and I melt down in front of everyone?</span>
<span class="wi-rung">What if it’s loud and I can’t get out?</span>
<span class="wi-rung">What if I don’t know what to say to people?</span>
<span class="wi-rung">What if I don’t know when it’s okay to leave?</span>
<span class="wi-rung step">Do this: pack my headphones, plan my exit, and tell one person I might leave early.</span>
</div>
</div>
</div>
</sc-if>
</section>

<section class="dark" style="padding: 28px 26px; display: flex; flex-direction: column; gap: 14px">
<div class="hand" style="font-size: 17px; color: #F1F9A6">Why this works</div>
<h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.12">Your brain’s job is to keep you safe, not necessarily accurate.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">When we’re anxious, our brain often starts predicting the future. The problem? Most of those predictions are stories, not facts.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">So when you notice yourself spiralling, instead of trying to solve everything in your head, get it onto paper.</p>
<div style="align-self: flex-start; padding: 12px 18px; border-radius: 16px; background: #F1F9A6; color: #1F1412; font-size: 15px; font-weight: 600; line-height: 1.45">You can’t always solve a problem from inside the same mental box that created it.</div>
</section>
</sc-if>

<p style="margin: 0; font-size: 15px; color: #6A5A57">Take a breath. Ask yourself:</p>
