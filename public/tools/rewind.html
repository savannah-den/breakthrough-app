<div class="hand" style="font-size: 17px; color: #F1F9A6">What is REWIND?</div>
<h2 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1.12">REWIND is a pattern interrupt.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">It helps you pause before the old program takes over. Instead of going:</p>
<div class="flow" aria-label="Old program: Trigger, Meaning, Feeling, Reaction, Regret">
<span class="pill grey">Trigger</span><span class="arr" style="color: #F6D6CF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill grey">Meaning</span><span class="arr" style="color: #F6D6CF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill grey">Feeling</span><span class="arr" style="color: #F6D6CF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill grey">Reaction</span><span class="arr" style="color: #F6D6CF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill grey">Regret</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">REWIND helps you create space so you can go:</p>
<div class="flow" aria-label="With REWIND: Trigger, Pause, Perspective, New Meaning, Chosen Response">
<span class="pill pink">Trigger</span><span class="arr" style="color: #F1F9A6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill pink">Pause</span><span class="arr" style="color: #F1F9A6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill pink">Perspective</span><span class="arr" style="color: #F1F9A6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill pink">New meaning</span><span class="arr" style="color: #F1F9A6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill lime" style="font-weight: 600">Chosen response</span>
</div>
<figure class="slide"><img src="/tools/assets/006fdaca6d5f43b131a7c3d521b57322.jpg" alt="Lesson slide: he says 'Stop overthinking this', she gets triggered. Event or action, then trigger, then react is crossed out and replaced with respond, with pause and breath in between."><figcaption>From the lesson: event → trigger → react becomes <strong style="color: #F1F9A6">respond</strong> when you pause and breathe.</figcaption></figure>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px">
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #FFF4EE">Because you can’t always choose what happens. <strong style="color: #F1F9A6">But you can choose what it means.</strong></p>
<div class="chain" style="padding-top: 8px">

<div class="ctile"><div class="ch"><span class="cn">4</span><span class="cl">Outcome</span></div><svg viewBox="0 0 160 100" role="img" aria-label="Two outcomes. On one side a person cheers on top of a hill: yay. On the other a person is stuck in a hole: oh no." style="width: 100%; height: auto; display: block"><defs><filter id="rw7" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="89"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="3"></feDisplacementMap></filter></defs><g filter="url(#rw7)"><path d="M80 6 L80 86" stroke="#B9ADAA" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"></path><path d="M2 88 Q38 34 74 88 Z" fill="#F1F9A6" stroke="#4E0C08" stroke-width="2.4" stroke-linejoin="round"></path><circle cx="38" cy="30" r="7" fill="#FFFFFF" stroke="#4E0C08" stroke-width="2"></circle><path d="M35 32 Q38 35 41 32" fill="none" stroke="#4E0C08" stroke-width="1.4" stroke-linecap="round"></path><path d="M38 37 L38 52 M38 52 L33 62 M38 52 L43 62" fill="none" stroke="#4E0C08" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M38 42 L28 30 M38 42 L48 30" fill="none" stroke="#4E0C08" stroke-width="2.6" stroke-linecap="round"></path><path d="M86 62 L156 62" stroke="#6A5A57" stroke-width="2.4" stroke-linecap="round"></path><path d="M100 62 Q120 100 140 62 Z" fill="#EDE3DF" stroke="#6A5A57" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="120" cy="70" r="7" fill="#FFFFFF" stroke="#6A5A57" stroke-width="2"></circle><path d="M117 74 Q120 71 123 74" fill="none" stroke="#6A5A57" stroke-width="1.4" stroke-linecap="round"></path><path d="M114 66 L108 54 M126 66 L132 54" fill="none" stroke="#6A5A57" stroke-width="2.6" stroke-linecap="round"></path></g><path transform="translate(54 6) scale(0.6)" d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z" fill="#F4C2F7" stroke="#4E0C08" stroke-width="2.4" stroke-linejoin="round"></path><text x="16" y="18" text-anchor="middle" font-family="'Patrick Hand SC', cursive" font-size="13" fill="#1F1412">yay!</text><text x="120" y="40" text-anchor="middle" font-family="'Patrick Hand SC', cursive" font-size="13" fill="#463A38">oh no…</text><text x="38" y="98" text-anchor="middle" font-family="'Patrick Hand SC', cursive" font-size="12" fill="#1F1412">on top</text><text x="120" y="98" text-anchor="middle" font-family="'Patrick Hand SC', cursive" font-size="12" fill="#463A38">stuck</text></svg><p>…and you change the <strong>outcome</strong>.</p></div>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<div class="hand" style="font-size: 17px; color: #A8231F">When to use it</div>
<h2 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1.1">Reach for REWIND when…</h2>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 22px; line-height: 1.3; color: #4E0C08">You realise you reacted in a way you wish you could take back, or do differently next time.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #463A38">Maybe you got defensive. Maybe you reacted overly emotional, or you can feel you were a bit over the top. Or it happened so fast, on autopilot, that you barely noticed until you were already mid unwanted behaviour.</p>
<div class="auto">
<div class="card">
<span class="hand" style="font-size: 16px; color: #A8231F">Out toward someone</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="pill pink">Yelling at your kids</span>
<span class="pill pink">Arguing with your partner</span>
<span class="pill pink">Sending a passive-aggressive message while you’re still mad</span>
<span class="pill pink">Snapping at your mum over one tiny comment</span>
<span class="pill pink">Giving someone the silent treatment</span>
<span class="pill pink">Getting defensive the second you hear feedback</span>
<span class="pill pink">Slamming cupboards so they know you’re annoyed</span>
</div>
</div>
<div class="card">
<span class="hand" style="font-size: 16px; color: #A8231F">In your head</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="pill pink">A mental spiral you can’t get out of, and no clue how you got there</span>
<span class="pill pink">Replaying a conversation on a loop at 2am</span>
<span class="pill pink">Rehearsing the argument you’ll never actually have</span>
<span class="pill pink">Convincing yourself everyone’s secretly annoyed with you</span>
</div>
</div>
<div class="card">
<span class="hand" style="font-size: 16px; color: #A8231F">On autopilot</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="pill pink">Scrolling your phone for an hour</span>
<span class="pill pink">Eating chocolate mindlessly out of the fridge</span>
<span class="pill pink">Impulse online shopping</span>
<span class="pill pink">Shutting down and going quiet</span>
<span class="pill pink">Cancelling plans because suddenly it’s all too much</span>
<span class="pill pink">Pouring a wine before you’ve even put your bag down</span>
</div>
</div>
</div>
<div class="pill-note"><span class="hand" style="font-size: 15px; color: #4E0C08">Basically</span><span>Any time something happens and it negatively affects your <strong>feelings, thoughts or actions</strong>, whether that came out toward the person or turned inward into a thought pattern that had you spiralling.</span></div>
<div class="callout"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>We’re <strong>hunting for the trigger</strong>, so you can notice it next time and change it.</span></div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="hand" style="font-size: 17px; color: #A8231F">See it in action</div>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 1.08">The text message spiral</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 26px; background: #FFFFFF; border: 1.5px solid #EDE3DF">
<span class="hand" style="font-size: 16px; color: #A8231F">The trigger</span>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 22px; background: #FAF7F5">
<div style="align-self: flex-end; max-width: 240px; padding: 10px 16px; border-radius: 20px 20px 6px 20px; background: #4E0C08; color: #FFF4EE; font-size: 15px; line-height: 1.45">Hey! Are we still on for Friday?</div>
<span style="align-self: flex-end; font-size: 12px; color: #6A5A57">Read 2:14 pm</span>
<div style="align-self: flex-start; display: flex; gap: 5px; padding: 12px 16px; border-radius: 20px; background: #EDE3DF" role="img" aria-label="No reply yet"><span style="width: 7px; height: 7px; border-radius: 999px; background: #8C7C79"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: #8C7C79"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: #8C7C79"></span></div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55">Someone reads your message and doesn’t reply.</p>
<span class="hand" style="font-size: 16px; color: #A8231F">The old program</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="bubble">“They hate me.”</span>
<span class="bubble">“I’ve done something wrong.”</span>
<span class="bubble">“They’re pulling away.”</span>
</div>
<span class="hand" style="font-size: 16px; color: #A8231F">The reaction</span>
<p style="margin: 0; font-size: 15px; line-height: 1.55">Based on that meaning, you message them again.</p>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 22px; background: #FAF7F5">
<div style="align-self: flex-end; max-width: 240px; padding: 10px 16px; border-radius: 20px 20px 6px 20px; background: #4E0C08; color: #FFF4EE; font-size: 15px; line-height: 1.45">Did I do something wrong??</div>
<div class="reply">No, not at all! I got distracted is all.</div>
</div>
<div class="pill-note"><span>All that spiralling… for a meaning <strong>you made up</strong>.</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 22px; border-radius: 26px; background: #FFFFFF; border: 2px solid #4E0C08">
<span class="hand" style="font-size: 16px; color: #A8231F; padding-bottom: 4px">Now, REWIND it</span>
<div class="rwrow"><span class="lk">R</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>Regulate</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">Before typing “did I do something wrong??”, put the phone down. Take a breath. Remind your body you are safe.</span></div></div>
<div class="rwrow"><span class="lk">E</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>Examine</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">The event is: they read it and haven’t replied. The meaning I made is: they hate me and I’ve done something wrong. That meaning is what wanted to send the anxious text.</span></div></div>
<div class="rwrow"><span class="lk">W</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>Walk into their world</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">Maybe they’re busy. Maybe they opened it and got distracted. Maybe they replied in their head. Maybe they’re overwhelmed. (Spoiler: they just got distracted.)</span></div></div>
<div class="rwrow"><span class="lk">I</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>Identify the ammunition</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">This hit my fear of rejection, and my “I’m not important” bullet.</span></div></div>
<div class="rwrow"><span class="lk">N</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>New meaning</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">Their delay does not automatically mean rejection. A read receipt is not a verdict on me.</span></div></div>
<div class="rwrow"><span class="lk">D</span><div style="display: flex; flex-direction: column; gap: 2px"><strong>Decide</strong><span style="font-size: 15px; line-height: 1.5; color: #463A38">I can wait. Or, if I need an answer, gently bring it back to their attention later, without accusation: “Hey, just bumping this, are we still on for Friday?”</span></div></div>
<div class="callout lime" style="margin-top: 10px"><span>Same outcome (they were never mad), minus the spiral, the anxious message and the vulnerability hangover.</span></div>
</div>
</div>
</section>

<section class="dark" id="rw-activity" style="padding: 28px 26px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px">
<div class="hand" style="font-size: 17px; color: #F1F9A6">Embodiment activity</div>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 1.08">Now REWIND one of yours.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">Pick one moment from the last week that you reacted to in a way you wish you hadn’t, or that’s still playing on a loop in your head, and walk it through, letter by letter. Each step explains the why, then gives you space to write. Your brain learns faster when it’s on the page.</p>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<div class="meter" style="grid-template-columns: repeat({{stepCount}}, minmax(0, 1fr))" aria-hidden="true"><sc-for list="{{meter}}" as="m" hint-placeholder-count="7"><span class="{{m.cls}}"></span></sc-for></div>
<span style="font-size: 13px; color: #F6D6CF">{{progressLabel}}</span>
</div>
</section>

<section class="step">
<div class="stephead"><span class="{{cls.trigger}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 6 L3 12 L11 18 Z M21 6 L13 12 L21 18 Z"></path></svg></span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Start here</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Choose one recent trigger</h2></div></div>
<div class="q"><span class="qtext">Think of a moment from the last week where you…</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="pill pink">Felt big emotions</span><span class="pill pink">Did something you wish you could take back</span><span class="pill pink">Mentally spiralled</span><span class="pill pink">Ended up at the unwanted outcome</span></div></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Write it down</span><textarea class="field short" value="{{momentText}}" onChange="{{onMomentText}}" placeholder="The moment, in a sentence or two…"></textarea></label>
</section>

<section class="step" id="rw-r">
<div class="stephead"><span class="{{cls.reg}}">R</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 1</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Regulate first</h2></div></div>
<p style="margin: 0; font-size: 16px; line-height: 1.6">Before you analyse, explain, defend, spiral, or send the message… <strong>regulate.</strong></p>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">If your survival brain is online, your logical brain is not fully available. So before you try to think your way out of the trigger, signal safety to your body. Try one of these now:</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<div class="tool"><strong>Physiological sigh</strong><span style="font-size: 13px; color: #6A5A57">See the breathing resource</span></div>
<div class="tool"><strong>Deep breathing</strong><span style="font-size: 13px; color: #6A5A57">See the breathing resource</span></div>
<div class="tool"><strong>Name five things you can see</strong><span style="font-size: 13px; color: #6A5A57">Rewatch Week 3, Lesson 5: Perception is Projection for a refresh on this</span></div>
<div class="tool"><strong>Feel your feet on the floor</strong></div>
<div class="tool"><strong>Place a hand on your chest</strong></div>
<div class="tool"><strong>Step away for a moment</strong></div>
</div>
<div class="pill-note"><span class="hand" style="font-size: 15px; color: #4E0C08">Say it out loud</span><span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.25">“I am safe. This is a trigger, not a tiger.”</span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">The goal is to create enough space to choose your response, instead of the automatic knee-jerk reaction.</p>
<figure class="slide"><img src="/tools/assets/1c5afb0325fedc27b1edea4e86f7787a.jpg" alt="Lesson slide: from the trigger, the straight path leads to an argument and the unwanted outcome. Pause and breathe opens a second path to the desired outcome, a hug."><figcaption>Pause + breathe opens up a second path: away from the unwanted outcome and toward the one you actually want.</figcaption></figure>
<button class="{{regCls}}" style="align-self: flex-start" aria-pressed="{{regPressed}}" onClick="{{toggleReg}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>I’ve regulated. My body feels safe enough to keep going.</button>
</section>

<section class="step" id="rw-e">
<div class="stephead"><span class="{{cls.examine}}">E</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 2</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Examine the trigger</h2></div></div>
<p style="margin: 0; font-size: 16px; line-height: 1.6">The event is not usually the cause of the feeling. <strong>The meaning is.</strong></p>
<figure class="slide"><img src="/tools/assets/8f13a4480c39f62268d2a911bbd4ea57.jpg" alt="Lesson slide: action or event, then a pink gun labelled trigger, then reaction."><figcaption>Action or event → trigger → reaction. What happened is the event. What you made it mean is what pulled the trigger.</figcaption></figure>
<div class="flow"><span class="pill">Event</span><span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill lime" style="font-weight: 600">Meaning</span><span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span><span class="pill">Feeling</span></div>
<div class="pex"><span class="hand">Our example for this activity</span><span>Your partner walks in after work, looks around and says: <strong>“Why is the kitchen still a mess?”</strong></span></div>
<div class="compare">
<div class="cmp old">
<div class="cmp-row"><span class="hand">Event</span><span>“Why is the kitchen still a mess?”</span></div>
<div class="cmp-row"><span class="hand">Meaning</span><span>“They think I’m lazy. I can never do enough.”</span></div>
<div class="cmp-row"><span class="hand">Feeling</span><span>Shame, then anger. You snap back.</span></div>
</div>
<div class="cmp new">
<div class="cmp-row"><span class="hand">Same event</span><span>“Why is the kitchen still a mess?”</span></div>
<div class="cmp-row"><span class="hand">Different meaning</span><span>“They’ve had a long day and walked into chaos. This is about their overwhelm, not my worth.”</span></div>
<div class="cmp-row"><span class="hand">Different feeling</span><span>Calmer. Able to actually talk about it.</span></div>
</div>
</div>

<div class="sub">
<div class="subhead"><span class="subnum">a</span><h3 style="margin: 0; font-weight: 700; font-size: 22px">What happened?</h3></div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Stick to the facts. <strong style="color: #1F1412">Not the story.</strong></p>
<textarea class="field" aria-label="What happened" value="{{facts}}" onChange="{{onFacts}}" placeholder="Just what a camera would have recorded…"></textarea>
<div class="eg"><span class="lbl">For example:</span><span class="e">“My partner asked why the kitchen was still a mess.”</span><span class="e">“Mum asked if I’m still doing ‘that coaching thing’.”</span><span class="e">“My partner said I was overthinking.”</span><span class="e">“My kid said ‘you never listen’.”</span></div>
</div>

<div class="sub">
<div class="subhead"><span class="subnum">b</span><h3 style="margin: 0; font-weight: 700; font-size: 22px">What did I make it mean?</h3></div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Write the story your brain created. All of it, Netflix drama and all.</p>
<textarea class="field" aria-label="What I made it mean" value="{{story}}" onChange="{{onStory}}" placeholder="The story my brain told me was…"></textarea>
<div class="eg"><span class="lbl">For example:</span><span class="e">“They think I’m lazy.”</span><span class="e">“She’s never been proud of me.”</span><span class="e">“I’m failing at everything.”</span><span class="e">“I’m a bad mum.”</span></div>
</div>

<div class="sub">
<div class="subhead"><span class="subnum">c</span><h3 style="margin: 0; font-weight: 700; font-size: 22px">What did I feel?</h3></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{feelChips}}" as="c" hint-placeholder-count="14"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">Something else?</span><textarea class="field short pink" value="{{feelOther}}" onChange="{{onFeelOther}}" placeholder="Name it in your own words"></textarea></label>
</div>
</section>

<section class="step" id="rw-w">
<div class="stephead"><span class="{{cls.walk}}">W</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 3</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Walk into their world</h2></div></div>
<p style="margin: 0; font-size: 16px; line-height: 1.6">Step into their model of the world. Ask:</p>
<ul class="list">
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What might they be seeing, feeling, or experiencing?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What might their intention have been?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What resources do they currently have available?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What fear, belief, or program might be influencing them? What might they be needing?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span><strong>Was it out of love or fear?</strong></span></li>
</ul>
<figure class="slide"><img src="/tools/assets/49f0892d6b07cf278010027527f0260b.jpg" alt="Lesson slide: It's about intention. Love: expansive, connective, open, abundant. Fear: restrictive, protective, destructive, limiting."><figcaption>It’s about intention. Love is expansive, connective, open. Fear is restrictive, protective, limiting.</figcaption></figure>
<div class="pex"><span class="hand">In the kitchen example</span><span>Maybe they had a rough day, they’re overstimulated and hungry, and walked into one more thing to deal with. Their fear might be “I can’t cope with one more thing,” not “you’re not enough.”</span></div>
<textarea class="field" aria-label="Their world" value="{{their}}" onChange="{{onTheir}}" placeholder="From where they were standing, maybe…"></textarea>
<div class="callout"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>This does not mean excusing their behaviour. It means <strong>understanding creates awareness</strong>, and awareness creates choice.</span></div>
</section>

<section class="step" id="rw-i">
<div class="stephead"><span class="{{cls.ammo}}">I</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 4</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Identify the ammunition</h2></div></div>
<p class="ask">What bullet did this hit?</p>
<figure class="slide"><img src="/tools/assets/cbfb24b61c4ae6264c959964f082362b.jpg" alt="Lesson slide: What ammo is in your gun? Bullets labelled red hair, ADHD isn't real, crying is weak, too much."><figcaption>What ammo is in your gun? Each bullet is a belief that makes the trigger fire.</figcaption></figure>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Which belief, wound, or old program is behind the bullet? Tick any that fit.</p>
<div class="pex"><span class="hand">In the kitchen example</span><span>This hit my “I’m failing” and “I’m not doing enough” bullets. Maybe an old one from childhood too, about having to earn love by getting everything right.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ammoChips}}" as="c" hint-placeholder-count="11"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">A different bullet?</span><textarea class="field short pink" value="{{ammoOther}}" onChange="{{onAmmoOther}}" placeholder="The belief behind it, in your words"></textarea></label>
<div style="padding: 16px 18px; border-radius: 18px; border: 2px solid #4E0C08; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px"><span class="hand" style="font-size: 15px; color: #A8231F">The bullet this hit:</span><span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.25">{{ammoSentence}}</span></div>
<div class="pill-note"><span class="hand" style="font-size: 15px; color: #4E0C08">Remember</span><span>The trigger is not always the problem. <strong>The ammunition is.</strong> If there were no bullet in the gun, the trigger wouldn’t have fired the same way.</span></div>
</section>

<section class="step" id="rw-n">
<div class="stephead"><span class="{{cls.meaning}}">N</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 5</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">New meaning</h2></div></div>
<figure class="slide"><img src="/tools/assets/6c2716ab4aea16ab43052f1471a489ab.jpg" alt="Lesson slide: on the left a grey, gloomy road of signs; on the right a bright, colourful world. A woman steps across a bridge labelled understanding."><figcaption>Same world, different meaning. Understanding is the bridge from the grey story to the bright one.</figcaption></figure>
<p style="margin: 0; font-size: 16px; line-height: 1.6">Now choose a more expansive meaning. Ask:</p>
<ul class="list">
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What else could this mean? What is another possible explanation?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What would I make this mean if I felt safe?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What would I make this mean if I knew I was loved?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What would I make this mean if I believed I was enough?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What meaning moves me toward my goal?</span></li>
<li><svg width="16" height="16" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>What meaning helps me become the version of myself I want to be?</span></li>
</ul>
<div class="pex"><span class="hand">In the kitchen example</span><span>They’re overwhelmed, not judging my worth. A messy kitchen is not a verdict on me as a person.</span></div>
<textarea class="field lime" style="min-height: 130px" aria-label="My new meaning" value="{{meaning}}" onChange="{{onMeaning}}" placeholder="What else this could mean is…"></textarea>
<sc-if value="{{hasBoth}}" hint-placeholder-val="{{ false }}">
<div class="compare">
<div class="cmp old"><span class="hand" style="font-size: 14px; color: #6A5A57">Old story</span><span style="font-size: 15px; line-height: 1.5; color: #463A38">{{storyShort}}</span></div>
<div class="cmp new"><span class="hand" style="font-size: 14px; color: #A8231F">New meaning</span><span style="font-size: 15px; line-height: 1.5; font-weight: 600">{{meaningShort}}</span></div>
</div>
</sc-if>
<div class="callout"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>You are not trying to gaslight yourself. You are giving your brain access to <strong>more than one story</strong>.</span></div>
</section>

<section class="step" id="rw-d">
<div class="stephead"><span class="{{cls.resp}}">D</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 6</span><h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.1">Decide your response</h2></div></div>
<p class="ask">What would I do next if I was responding instead of reacting?</p>
<div class="compare">
<div class="cmp old">
<span class="hand" style="font-size: 16px; color: #6A5A57">Not…</span>
<span style="font-size: 15px; line-height: 1.5; color: #463A38">What protects my ego?</span>
<span style="font-size: 15px; line-height: 1.5; color: #463A38">What proves I’m right?</span>
<span style="font-size: 15px; line-height: 1.5; color: #463A38">What gets the last word?</span>
<span style="font-size: 15px; line-height: 1.5; color: #463A38">What avoids discomfort?</span>
</div>
<div class="cmp new">
<span class="hand" style="font-size: 16px; color: #A8231F">But…</span>
<span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.25">What moves me toward the reality I want to create?</span>
</div>
</div>
<div class="pex"><span class="hand">In the kitchen example</span><span>Instead of snapping back: “Sounds like a rough day. I’ve been flat out too. Can we tackle it together after dinner?”</span></div>
<p style="margin: 0; font-size: 15px; color: #463A38">Pick one action, or write your own.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="Choose one response"><sc-for list="{{respChips}}" as="c" hint-placeholder-count="12"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}"><span class="radio"><span></span></span>{{c.label}}</button></sc-for></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">In my own words</span><textarea class="field short pink" value="{{respText}}" onChange="{{onRespText}}" placeholder="e.g. ask them what they need"></textarea></label>
<div class="pill-note"><span>This is where you move from <strong>reaction</strong> to <strong>response</strong>.</span></div>
<button class="primary" style="align-self: flex-start" onClick="{{commit}}">I’m choosing this response</button>
</section>

<section class="dark" style="position: relative; overflow: hidden; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px">
<svg width="120" height="120" viewBox="0 0 24 24" fill="#F4C2F7" aria-hidden="true" style="position: absolute; right: -18px; top: -18px; opacity: .25"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg>
<div class="hand" style="font-size: 17px; color: #F1F9A6">Final reminder</div>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(28px, 4.6vw, 40px); line-height: 1.08">REWIND is not about never getting triggered.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #F6D6CF">You will still get triggered. You’re human. This is about noticing the trigger sooner, creating a gap, choosing a new meaning, and responding in a way that moves you toward the reality you want.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #F6D6CF">Every time you do that, you’re building a new groove.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px">
<span class="pill pink">One pause.</span><span class="pill pink">One breath.</span><span class="pill pink">One new meaning.</span><span class="pill lime" style="font-weight: 600">One different response at a time.</span>
</div>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="hand" style="font-size: 17px; color: #A8231F">Keep it</div>
<h2 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1.1">Save your REWIND</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Turn it into a plan for next time. Your response comes from step D. Fill in the last two bits and watch your card build.</p>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">If this same thing happens again…</span><span style="font-size: 13px; line-height: 1.5; color: #6A5A57">What actually caused it? If you knew what specifically triggered the meaning and feeling you created, what would it be? Keep it a little broad, so it covers all the other times it’s happened slightly differently but is really the same trigger.</span><textarea class="field short" value="{{nextTrigger}}" onChange="{{onNextTrigger}}" placeholder="e.g. someone says no to plans"></textarea></label>
<div class="eg"><span class="lbl">For example:</span><span class="e">someone says no to plans</span><span class="e">someone questions my actions</span><span class="e">I feel left out</span><span class="e">I’m told I’m doing it wrong</span></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">I will respond differently because…</span><span style="font-size: 13px; color: #6A5A57">The outcome you want to create by changing your actions.</span><textarea class="field short lime" value="{{because}}" onChange="{{onBecause}}" placeholder="e.g. I want us to feel like a team, not opponents"></textarea></label>
<div class="eg"><span class="lbl">For example:</span><span class="e">I want my kids to feel safe with me</span><span class="e">I get to feel calm and in control</span><span class="e">I want a closer relationship with my partner</span><span class="e">I don’t have to carry the guilt afterwards</span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #6A5A57">Save it to your Becoming Book with today’s date, so you can look back and see how you’ve changed.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a class="primary lime edge" href="#bt-book-save" style="text-decoration:none">Save to my Becoming Book</a>
</div>
<sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #A8231F">{{err}}</span></sc-if>
</div>
<div style="width: 100%; max-width: 420px; justify-self: center; background: #FFFFFF; border-radius: 28px; overflow: hidden; border: 1.5px solid #EDE3DF; box-shadow: 0 16px 40px rgba(78,12,8,.10)">
<div style="background: #4E0C08; color: #FFF4EE; padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 4px">
<span class="hand" style="font-size: 14px; color: #F1F9A6">REWIND · Respond instead of react</span>
<span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.1">My REWIND</span>
<span style="font-size: 13px; color: #F6D6CF">{{today}}</span>
</div>
<div style="padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px">
<span class="hand" style="font-size: 15px; color: #A8231F">My next-time plan</span>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 23px; line-height: 1.55; color: #463A38">Next time <span class="{{planTrigCls}}">{{planTrig}}</span>, I will notice it, take a breath and <span class="{{planRespCls}}">{{planResp}}</span>, because <span class="{{planBecCls}}">{{planBec}}</span>.</p>
</div>
</div>
</section>

<section class="step">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="hand" style="font-size: 17px; color: #A8231F">Be gentle with yourself</div>
<h2 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1.1">This isn’t an overnight thing.</h2>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.65">Your well-worn grooves for some of these can be <strong>really deep</strong>. You’ve had years of unconsciously practising it one way. So for now, just noticing and adjusting your behaviour after the fact is enough. That <em>is</em> the rewiring.</p>
<figure class="slide"><img src="/tools/assets/423aca9e5b3ef0ad25536bd6b48a95a3.jpg" alt="Lesson slide: a deep groove pressed into clay runs from the trigger down to the unwanted outcome, with a newer, shallower path branching off to the desired outcome."><figcaption>The old groove runs straight to the unwanted outcome. Every time you choose differently, you carve the new path a little deeper.</figcaption></figure>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Remember the hierarchy of learning from Week 1’s videos?</p>
<ol class="stairs">
<li><span class="sn">1</span><div style="display: flex; flex-direction: column; gap: 2px"><span class="st">Unconsciously incompetent</span><span class="sd">You don’t even notice you’re doing it. It just happens.</span></div></li>
<li class="here" style="margin-left: min(5vw, 28px)"><span class="sn">2</span><div style="display: flex; flex-direction: column; gap: 2px"><span class="st">Consciously incompetent</span><span class="sd">You notice, but usually after the fact. You still react, and then you catch it.</span><span class="here-tag">Noticing after? You’re here, and that’s progress</span></div></li>
<li style="margin-left: calc(2 * min(5vw, 28px))"><span class="sn">3</span><div style="display: flex; flex-direction: column; gap: 2px"><span class="st">Consciously competent</span><span class="sd">You catch it in the moment and choose a new response. It takes effort, but you can do it.</span></div></li>
<li style="margin-left: calc(3 * min(5vw, 28px))"><span class="sn">4</span><div style="display: flex; flex-direction: column; gap: 2px"><span class="st">Unconsciously competent</span><span class="sd">The new response is your default. You barely have to think about it.</span></div></li>
</ol>
<div class="pill-note"><span>It takes time to rewire. Every time you notice, even after the fact, you’re moving up a step.</span></div>
</section>
