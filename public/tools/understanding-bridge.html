<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; background: #FFFFFF; border: 1.5px solid #EDE3DF; border-radius: 22px"><div style="display: flex; align-items: center; gap: 10px"><span style="flex: none; width: 36px; height: 36px; border-radius: 999px; background: #4E0C08; color: #F1F9A6; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 19px">3</span><span style="font-family: 'Patrick Hand SC', cursive; font-size: 18px; letter-spacing: 0.06em; color: #4E0C08">The middle</span></div><svg viewBox="0 0 200 190" role="img" aria-label="A stick person with open arms standing in the middle of the bridge, seeing both people on either side" style="width: 100%; height: auto; display: block"><defs><filter id="ub3" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="37"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="3"></feDisplacementMap></filter></defs><g filter="url(#ub3)"><path d="M0 120 L54 120 L62 190 L0 190 Z" fill="#F4C2F7" stroke="#4E0C08" stroke-width="2.4" stroke-linejoin="round"></path><path d="M146 120 L200 120 L200 190 L138 190 Z" fill="#F4C2F7" stroke="#4E0C08" stroke-width="2.4" stroke-linejoin="round"></path><path d="M54 92 L54 121 M146 92 L146 121" stroke="#4E0C08" stroke-width="3" stroke-linecap="round"></path><path d="M54 94 Q100 124 146 94" fill="none" stroke="#4E0C08" stroke-width="2.2" stroke-linecap="round"></path><path d="M54 121 Q100 141 146 121" fill="none" stroke="#4E0C08" stroke-width="3" stroke-linecap="round"></path><path d="M72 104 L72 127 M86 108 L86 130 M114 108 L114 130 M128 104 L128 127" stroke="#4E0C08" stroke-width="1.6" stroke-linecap="round"></path><circle cx="26" cy="72" r="8" fill="#FFFFFF" stroke="#4E0C08" stroke-width="2"></circle><path d="M26 80 L26 102 M26 102 L19 120 M26 102 L33 120 M26 87 L17 98 M26 87 L35 98" fill="none" stroke="#4E0C08" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="174" cy="72" r="8" fill="#FFFFFF" stroke="#4E0C08" stroke-width="2"></circle><path d="M174 80 L174 102 M174 102 L167 120 M174 102 L181 120 M174 87 L165 98 M174 87 L183 98" fill="none" stroke="#4E0C08" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="100" cy="76" r="9" fill="#FFFFFF" stroke="#4E0C08" stroke-width="2"></circle><path d="M96 78 Q100 81 104 78" fill="none" stroke="#4E0C08" stroke-width="1.6" stroke-linecap="round"></path><path d="M100 85 L100 112 M100 112 L92 131 M100 112 L108 131" fill="none" stroke="#4E0C08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M100 92 L84 82 M100 92 L116 82" fill="none" stroke="#4E0C08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M70 60 Q60 52 50 58 M130 60 Q140 52 150 58" fill="none" stroke="#D3302B" stroke-width="2" stroke-linecap="round"></path></g><path transform="translate(88 30)" d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z" fill="#F1F9A6" stroke="#4E0C08" stroke-width="2" stroke-linejoin="round"></path><path transform="translate(150 22) scale(0.55)" d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z" fill="#F4C2F7" stroke="#4E0C08" stroke-width="2.8" stroke-linejoin="round"></path></svg><figcaption style="font-size: 15px; line-height: 1.5; color: #1F1412; text-align: center">then meet in the middle and see the whole picture.</figcaption></figure>

</header>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div class="hand" style="font-size: 17px; color: #A8231F">Which bridge do I need?</div>
<p style="margin: 0; max-width: 680px; font-size: 15px; line-height: 1.6; color: #463A38">Not every situation needs the same level of processing. Sometimes you need to heal an old wound. Sometimes you just need a quick perspective shift. Sometimes you need to stop thinking and let it out.</p>
</div>

<div class="helper">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="hand" style="font-size: 16px; color: #4E0C08">Need help deciding?</span>
<span style="font-size: 15px; line-height: 1.5">Tap what feels most true right now and we’ll guide you to the right bridge.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="What feels most true right now"><sc-for list="{{helpOpts}}" as="o" hint-placeholder-count="6"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<sc-if value="{{hasRec}}" hint-placeholder-val="{{ false }}">
<div class="recnote" role="status"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span style="flex: 1 1 220px; font-size: 15px; line-height: 1.5">{{recText}}</span><button class="primary" onClick="{{openRec}}">{{recBtn}}</button></div>
</sc-if>
</div>

<div class="cards">
<article class="{{cards.quick.cls}}">
<div class="cover" style="background: #CDCFCE"><img src="/tools/assets/a49bbf3641d388a230741ffb5695ce25.jpg" alt="Three people seen from above around an event: A is you, B is them, C is the observer" style="width: 100%; height: 100%; object-fit: cover; display: block"><sc-if value="{{cards.quick.rec}}" hint-placeholder-val="{{ false }}"><span class="recbadge">Recommended for you</span></sc-if></div>
<div class="cbody">
<span class="tag">3-minute perspective shift</span>
<h3 class="ctitle">The Quick Bridge</h3>
<p class="csub">When you’re hurt, frustrated, triggered, assuming the worst, or stuck in an RSD spiral.</p>
<span class="hand" style="font-size: 14px; color: #A8231F">Use it for things like</span>
<ul class="uselist"><li>They haven’t replied to my message</li><li>My partner seemed annoyed</li><li>My boss gave me feedback</li><li>Someone cancelled plans</li><li>I think somebody is judging me</li><li>I feel rejected</li><li>I’m creating stories in my head</li></ul>
<button class="primary open" onClick="{{openQuick}}">Open the Quick Bridge<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</article>

<article class="{{cards.deep.cls}}">
<div class="cover" style="background: #F49AAB"><img src="/tools/assets/c6c4d7181abcef8e3f1eb0d6edbe60e5.jpg" alt="A rope bridge between two cliffs: you on one side, them on the other, the observer in the middle" style="width: 100%; height: 100%; object-fit: cover; display: block"><sc-if value="{{cards.deep.rec}}" hint-placeholder-val="{{ false }}"><span class="recbadge">Recommended for you</span></sc-if></div>
<div class="cbody">
<span class="tag">Journal · one specific event</span>
<h3 class="ctitle">The Deep Bridge</h3>
<p class="csub">For big events, painful memories, old wounds and limiting beliefs that still carry emotional weight.</p>
<span class="hand" style="font-size: 14px; color: #A8231F">Use it for things like</span>
<ul class="uselist"><li>Being bullied</li><li>A painful breakup, or being cheated on</li><li>Feeling abandoned or rejected</li><li>A difficult childhood experience</li><li>A parent constantly criticising you</li><li>A friendship ending</li><li>A traumatic workplace experience</li><li>A conflict that changed a relationship</li></ul>
<button class="primary open" onClick="{{openDeep}}">Open the Deep Bridge<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</article>

<article class="{{cards.release.cls}}">
<div class="cover" style="background: #7A2A8C"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer" style="width: 100%; height: 100%; object-fit: cover; display: block"><sc-if value="{{cards.release.rec}}" hint-placeholder-val="{{ false }}"><span class="recbadge">Recommended for you</span></sc-if></div>
<div class="cbody">
<span class="tag">Somatic · out loud</span>
<h3 class="ctitle">The Bridge Release</h3>
<p class="csub">When the hurt isn’t attached to one moment. It’s attached to a person. For when you don’t need more thinking, you need release.</p>
<span class="hand" style="font-size: 14px; color: #A8231F">Use it for someone like</span>
<ul class="uselist"><li>A parent who hurt, criticised or dismissed you</li><li>An ex you’re still angry at</li><li>A friend who let you down again and again</li><li>A teacher, coach or boss who left a mark</li><li>Someone who betrayed or abandoned you</li><li>Someone who passed with things unsaid</li><li>Yourself in the past</li></ul>
<button class="primary open" onClick="{{openRelease}}">Open the Bridge Release<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</article>
</div>
</section>
</sc-if>

<sc-if value="{{isPage}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 18px; padding-top: 8px">
<button class="ghost back" onClick="{{goHome}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>All bridges</button>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="hand" style="font-size: 18px; color: #A8231F">The Understanding Bridge</div>
<h1 style="margin: 0; font-weight: 700; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.02">{{pageTitle}}</h1>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(20px, 3vw, 26px); line-height: 1.25; color: #4E0C08">{{pageTag}}</p>
</div>
<sc-if value="{{isQuick}}" hint-placeholder-val="{{ false }}"><div class="hero" style="background: #CDCFCE"><img src="/tools/assets/a49bbf3641d388a230741ffb5695ce25.jpg" alt="Three people seen from above around an event: A is you, B is them, C is the observer" style="width: 100%; max-height: 460px; object-fit: contain; display: block; margin: 0 auto"></div></sc-if>
<sc-if value="{{isDeep}}" hint-placeholder-val="{{ false }}"><div class="hero" style="background: #F49AAB"><img src="/tools/assets/a88193d73fc4900672277473c572dbc5.jpg" alt="A rope bridge between two cliffs: you on one side, them on the other, the observer in the middle" style="width: 100%; height: auto; display: block"></div></sc-if>
<sc-if value="{{isRelease}}" hint-placeholder-val="{{ false }}"><div class="hero" style="background: #7A2A8C"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
<div class="callout lime"><svg width="22" height="22" viewBox="0 0 24 24" fill="#E890EC" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span><strong>Not sure where to start?</strong> If focusing on a whole person feels overwhelming, start with the Deep Bridge on one specific event. Releasing the charge from a few events often softens how you feel about the person as a whole. There’s no right way. Start where you feel safest.</span></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="meter" style="grid-template-columns: repeat({{stepCount}}, minmax(0, 1fr))" aria-hidden="true"><sc-for list="{{meter}}" as="m" hint-placeholder-count="3"><span class="{{m.cls}}"></span></sc-for></div>
<span style="font-size: 13px; color: #6A5A57">{{progressLabel}}</span>
</div>
</section>
</sc-if>

<sc-if value="{{notRelease}}" hint-placeholder-val="{{ true }}">
<section class="dark" style="padding: 28px 26px; display: flex; flex-direction: column; gap: 14px">
<div class="hand" style="font-size: 17px; color: #F1F9A6">Why this works</div>
<h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.12">Change the meaning, you change the feeling.</h2>
<div class="flow" aria-label="Event leads to meaning leads to feeling"><span class="f">Event</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span class="f hi">Meaning</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span class="f">Feeling</span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">It’s rarely the event itself that keeps hurting. It’s the meaning we attached to it. When you step into someone else’s model of the world, you get new information, and new information lets your brain write a new meaning.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 10px 16px; border-radius: 16px; background: #F1F9A6; color: #1F1412; font-size: 15px; font-weight: 600; line-height: 1.45">People do the best they can with the resources they have available.</span>
<span style="padding: 10px 16px; border-radius: 16px; background: #FBE6FC; color: #1F1412; font-size: 15px; font-weight: 600; line-height: 1.45">Hurt people hurt people.</span>
<span style="padding: 10px 16px; border-radius: 16px; background: #FFF4EE; color: #1F1412; font-size: 15px; font-weight: 600; line-height: 1.45">Intention and impact are often different.</span>
</div>
</section>
</sc-if>

<sc-if value="{{isQuick}}" hint-placeholder-val="{{ true }}">
<section class="step">
<div class="stephead"><span class="{{done.qa}}">A</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Position A · You</span><h2 class="steptitle">Your side of the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/a49bbf3641d388a230741ffb5695ce25.jpg" alt="Three people seen from above around an event: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1200 900" aria-hidden="true"><ellipse cx="190" cy="610" rx="190" ry="250" fill="none" stroke="#F1F9A6" stroke-width="10" stroke-linecap="round" transform="rotate(-6 190 610)"></ellipse><ellipse cx="196" cy="606" rx="200" ry="244" fill="none" stroke="#F1F9A6" stroke-width="5" stroke-dasharray="38 23" transform="rotate(4 190 610)" opacity=".85"></ellipse><rect x="40" y="300" width="300" height="64" rx="32" fill="#F1F9A6" stroke="#1F1412" stroke-width="3"></rect><text x="190" y="332" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="38" fill="#1F1412">YOU’RE HERE</text></svg></figure>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What happened, and how did that make me feel?</span><span class="hint">Brain dump it all. Messy. Be at effect. Just get the feelings out.</span><textarea class="field big" value="{{v.qHappened}}" onChange="{{on.qHappened}}" placeholder="They haven’t replied and I feel…"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What story am I telling myself?</span><span class="hint">What am I making this mean? What story have I created?</span><textarea class="field pink" value="{{v.qStory}}" onChange="{{on.qStory}}" placeholder="I’m making it mean…"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What are the actual facts?</span><span class="hint">Only what a camera would have recorded. No mind reading.</span><textarea class="field" style="min-height: 90px" value="{{v.qFacts}}" onChange="{{on.qFacts}}" placeholder="The facts are…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.qb}}">B</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Position B · Them</span><h2 class="steptitle">Walk across the bridge</h2></div></div>

<p class="hint">Enter their model of the world. Look through their eyes at you and the event.</p>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What might be happening from their perspective?</span>
<ul class="prompts"><li>What could be in their model of the world?</li><li>How did your actions make them feel?</li><li>What limiting belief might they be acting from?</li><li>Are they projecting their own stuff onto you?</li><li>What resources might they be missing?</li></ul>
<textarea class="field big" value="{{v.qTheirView}}" onChange="{{on.qTheirView}}" placeholder="From where they’re standing…"></textarea></label>
<div class="q"><span class="qtext">What was likely their intention?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{qIntentOpts}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Is there another explanation? What else could be true?</span><textarea class="field" style="min-height: 90px" value="{{v.qOther}}" onChange="{{on.qOther}}" placeholder="Maybe they were…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.qc}}">C</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Position C · Observer / Future You</span><h2 class="steptitle">Stand in the middle</h2></div></div>
<figure class="pic"><img src="/tools/assets/a49bbf3641d388a230741ffb5695ce25.jpg" alt="Three people seen from above around an event: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1200 900" aria-hidden="true"><ellipse cx="590" cy="215" rx="200" ry="205" fill="none" stroke="#F1F9A6" stroke-width="10" stroke-linecap="round" transform="rotate(-6 590 215)"></ellipse><ellipse cx="596" cy="211" rx="210" ry="199" fill="none" stroke="#F1F9A6" stroke-width="5" stroke-dasharray="38 23" transform="rotate(4 590 215)" opacity=".85"></ellipse><rect x="820" y="100" width="300" height="64" rx="32" fill="#F1F9A6" stroke="#1F1412" stroke-width="3"></rect><text x="970" y="132" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="38" fill="#1F1412">YOU’RE HERE</text></svg></figure>
<p class="hint">Step out of both of you. Picture Future You standing in the middle of the bridge, seeing the whole thing.</p>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What meaning would better serve me?</span><textarea class="field lime" value="{{v.qMeaning}}" onChange="{{on.qMeaning}}" placeholder="A more helpful way to see this is…"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What action moves me toward my goal? What would Future Me do next?</span><textarea class="field pink" style="min-height: 90px" value="{{v.qAction}}" onChange="{{on.qAction}}" placeholder="Next, I’m going to…"></textarea></label>
<button class="{{quickDoneCls}}" style="align-self: flex-start" onClick="{{finishQuick}}">{{quickDoneLabel}}</button>
</section>
</sc-if>

<sc-if value="{{isDeep}}" hint-placeholder-val="{{ false }}">
<section class="step">
<div class="stephead"><span class="{{done.d0}}">1</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 1</span><h2 class="steptitle">Before you begin</h2></div></div>
<figure class="pic"><img src="/tools/assets/bb13b59b8e3ecad2e8c389d6596a1c51.jpg" alt="You on your cliff, them on theirs, the observer in the middle of the bridge, with the event far below"></figure>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Choose one specific event.</span><span class="hint">One moment, not a whole relationship. (For a whole person, try the Bridge Release.)</span><input class="input" value="{{v.dEvent}}" onChange="{{on.dEvent}}" placeholder="The time when…"></label>
<div class="q"><span class="qtext">How emotionally intense does it feel right now?</span><span style="font-size: 13px; color: #6A5A57">0 = neutral · 10 = extremely intense</span><div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Intensity before"><sc-for list="{{beforeOpts}}" as="o" hint-placeholder-count="11"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
</section>

<section class="step">
<div class="stephead"><span class="{{done.d1}}">2</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 2</span><h2 class="steptitle">Your side of the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/7380668367de1af6d003f352f99f4aa5.jpg" alt="You, close up, back inside the event, looking at them in the event"></figure>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Go back to the time of the event, as if you’re still in it.</span>
<ul class="prompts"><li>What could you see?</li><li>What did you feel?</li><li>What was happening?</li></ul>
<textarea class="field big" value="{{v.dInside}}" onChange="{{on.dInside}}" placeholder="I’m standing there and…"></textarea></label>
<figure class="pic"><img src="/tools/assets/b57862c5b864a8a3e79922d5081c1283.jpg" alt="You standing on your cliff, looking down at your past self and them in the event"></figure>
<div class="callout"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>Now step out of the event, back into this present moment, and look at your past self in it.</span></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Looking back from here…</span>
<ul class="prompts"><li>What meaning did you make of the event?</li><li>What story did you attach to it?</li><li>How does it make you feel looking back now that you’re out of it?</li><li>What did you need that you didn’t receive?</li><li>What do you wish you’d said, or done differently?</li></ul>
<span class="hint">Write it all. Do not edit yourself.</span>
<textarea class="field big pink" value="{{v.dLooking}}" onChange="{{on.dLooking}}" placeholder="Looking back, I made it mean…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.d2}}">3</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 3</span><h2 class="steptitle">Walk across the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/f846e29006165c8ba62f143c8d86e3f8.jpg" alt="You walking across the bridge to stand beside them"></figure>
<p class="hint">Imagine stepping into their model of the world. You are now that person, looking at you.</p>
<figure class="pic"><img src="/tools/assets/ce1f0d0a137e909226f899170d5bf322.jpg" alt="Them, close up, looking at you in the event through their eyes"></figure>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Acting as if you were them…</span>
<ul class="prompts"><li>What could they see?</li><li>What did they feel?</li><li>What was happening for them?</li><li>What was their perspective?</li></ul>
<textarea class="field big" value="{{v.dThem}}" onChange="{{on.dThem}}" placeholder="As them, I’m seeing…"></textarea></label>
<figure class="pic"><img src="/tools/assets/e2fc964b6b5c30a9366d14211bd9d7cc.jpg" alt="You and them standing together on their cliff, looking back at the event"></figure>
<div class="callout"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F1F9A6" stroke="#4E0C08" stroke-width="1.4" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg><span>Now step back out of them and stand on the cliff <em>with</em> them, looking back at the event. Remember: people do the best they can with the resources they have available.</span></div>
<div class="q"><span class="qtext">Were they acting from love or fear?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{dIntentOpts}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="q"><span class="qtext">What do you think was behind it?</span><span style="font-size: 13px; color: #6A5A57">Tick all that might apply. Intention and impact are often different.</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{howChips}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for></div></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What might have been happening in their world?</span>
<ul class="prompts"><li>Think about their model of the world. What resources were they missing?</li><li>Did it come from their own place of hurt, or their own limiting belief?</li><li>What makes more sense now that didn’t before?</li></ul>
<textarea class="field pink" value="{{v.dSense}}" onChange="{{on.dSense}}" placeholder="What makes more sense now is…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.d3}}">4</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 4</span><h2 class="steptitle">The middle of the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/ed17ec258b156c8af9563a76d76a4939.jpg" alt="You walking back across the bridge to the observer in the middle"></figure>
<p class="hint">Imagine someone wise, who loves you both, standing in the middle of the bridge. Someone who can see the whole picture. Walk to them and watch the event through their eyes.</p>
<div class="q"><span class="qtext">Who’s standing in the middle?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{wiseOpts}}" as="o" hint-placeholder-count="5"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<sc-if value="{{wiseIsOther}}" hint-placeholder-val="{{ false }}"><input class="input" aria-label="Who is it?" value="{{v.dWiseOther}}" onChange="{{on.dWiseOther}}" placeholder="Who is it?"></sc-if>
</div>
<figure class="pic"><img src="/tools/assets/19f0304514144c82ce095a59a4ede0fd.jpg" alt="The observer and you on the bridge, watching you and them in the event"></figure>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Through their eyes…</span>
<ul class="prompts"><li>What would they say?</li><li>What advice would they give you both?</li><li>What can they see that neither of you could?</li><li>What lesson can you take from this experience?</li></ul>
<textarea class="field big lime" value="{{v.dWiseSays}}" onChange="{{on.dWiseSays}}" placeholder="They’d say…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.d4}}">5</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 5</span><h2 class="steptitle">Build a new bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/3ab75ae85fd37ba180922aa6e0d5f4fe.jpg" alt="You, the observer and them meeting together in the middle of the bridge above the event"></figure>
<p class="hint">You’ve collected all three perspectives. Now choose what you build with them.</p>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What meaning would better serve the person you are becoming?</span><textarea class="field lime" value="{{v.dMeaning}}" onChange="{{on.dMeaning}}" placeholder="The meaning I choose now is…"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Resources then vs now</span>
<ul class="prompts"><li>What resources do you have now that you didn’t have then?</li><li>What resources do they have now that they didn’t have then?</li><li>What resources do you have now that they needed then?</li></ul>
<textarea class="field" value="{{v.dResources}}" onChange="{{on.dResources}}" placeholder="Now I have…"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What do you choose to do with this experience moving forward?</span><textarea class="field pink" style="min-height: 90px" value="{{v.dChoose}}" onChange="{{on.dChoose}}" placeholder="Moving forward, I choose…"></textarea></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.d5}}">6</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 6</span><h2 class="steptitle">Finish</h2></div></div>
<div class="q"><span class="qtext">Rate the emotional intensity now.</span><span style="font-size: 13px; color: #6A5A57">{{beforeNote}}</span><div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Intensity now"><sc-for list="{{afterOpts}}" as="o" hint-placeholder-count="11"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{hasShift}}" hint-placeholder-val="{{ false }}"><div class="pill-note"><span class="hand" style="font-size: 15px; color: #4E0C08">Look at that</span><span><strong>{{shiftText}}</strong></span></div></sc-if>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">What shifted?</span><textarea class="field" value="{{v.dShifted}}" onChange="{{on.dShifted}}" placeholder="What feels different now is…"></textarea></label>
<button class="{{deepDoneCls}}" style="align-self: flex-start" onClick="{{finishDeep}}">{{deepDoneLabel}}</button>
</section>
</sc-if>

<sc-if value="{{isRelease}}" hint-placeholder-val="{{ false }}">
<section class="dark" style="padding: 28px 26px; display: flex; flex-direction: column; gap: 14px">
<div class="hand" style="font-size: 17px; color: #F1F9A6">When you need to let it out</div>
<h2 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1.12">Sometimes understanding isn’t enough.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">Sometimes you’ve already analysed it a hundred times. You don’t need more thinking. You need release. This bridge helps you move emotions through your body instead of carrying them around.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #F6D6CF">Do it with an empty chair or standing positions, speaking out loud while you imagine the person in front of you. You can journal it if you’d rather, but speaking lets you feel it in your body without waiting for your pen to catch up. Guided audio coming soon.</p>
</section>

<section class="step">
<div class="stephead"><span class="{{done.r0}}">1</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Before you begin</span><h2 class="steptitle">Set yourself up safely</h2></div></div>
<figure class="pic"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer"></figure>
<p class="hint" style="font-weight: 600; color: #1F1412">Set up three spots in your space before you start: A for you, B for them, and C for the observer.</p>
<p class="hint">This can bring up strong emotions. Crying, anger, grief, relief, numbness or exhaustion are all normal parts of the process.</p>
<div class="q"><span class="qtext">Tick these off before you start</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{readyChips}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for></div></div>
<div class="callout care" role="note"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F4C2F7" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.9 0 5.9 4.1 4.4 7.4C19.5 16.4 12 21 12 21z"></path></svg><span>This isn’t a substitute for therapy, crisis support or medical care. If you’re in severe distress, having thoughts of suicide or self-harm, or feel unable to keep yourself regulated, please pause and reach out for support. <strong>Lifeline 13 11 14</strong> · <strong>Beyond Blue 1300 22 4636</strong> · <strong>000</strong> in an emergency (Australia). Your wellbeing always comes first.</span></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="qtext">Who’s in the chair?</span><span class="hint">A parent, an ex, a friend, a boss… or yourself in the past. Pick a chair or a spot and imagine they’re really there. A photo helps if you’re struggling to picture them.</span><input class="input" value="{{v.rWho}}" onChange="{{on.rWho}}" placeholder="Their name, or just “them”"></label>
</section>

<section class="step">
<div class="stephead"><span class="{{done.r1}}">2</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 1</span><h2 class="steptitle">Your side of the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1920 1032" aria-hidden="true"><ellipse cx="500" cy="690" rx="220" ry="250" fill="none" stroke="#F1F9A6" stroke-width="11" stroke-linecap="round" transform="rotate(-6 500 690)"></ellipse><ellipse cx="506" cy="686" rx="230" ry="244" fill="none" stroke="#F1F9A6" stroke-width="6" stroke-dasharray="44 26" transform="rotate(4 500 690)" opacity=".85"></ellipse><rect x="330" y="940" width="340" height="76" rx="38" fill="#F1F9A6" stroke="#1F1412" stroke-width="4"></rect><text x="500" y="978" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="44" fill="#1F1412">YOU’RE HERE</text></svg></figure>
<p class="hint">Say everything you wish you could say. You can’t hurt them. They aren’t here and they’ll never know you said it. So if you want to call your mum a c*nt, DO IT. If you want to tell your dad he’s a piece of shit, DO IT. It doesn’t mean anything about you that you feel this way.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Yell. Cry. Scream. Whisper. Feel it in your body.</p>
<ul class="prompts"><li>How did they hurt you?</li><li>What did they do that disappointed you?</li><li>What angered you?</li><li>What did you need that they didn’t give you?</li><li>What did you never get to say?</li></ul>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="hand" style="padding: 6px 14px; border-radius: 999px; background: #F1F9A6; border: 1.5px solid #1F1412; font-size: 15px">Don’t edit.</span><span class="hand" style="padding: 6px 14px; border-radius: 999px; background: #F1F9A6; border: 1.5px solid #1F1412; font-size: 15px">Don’t minimise.</span><span class="hand" style="padding: 6px 14px; border-radius: 999px; background: #F1F9A6; border: 1.5px solid #1F1412; font-size: 15px">Don’t protect them.</span><span style="padding: 6px 14px; border-radius: 999px; background: #FBE6FC; font-size: 14px">This is your space.</span></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">Optional: jot anything you want to remember afterwards</span><textarea class="field" style="min-height: 84px" value="{{v.rSaidNotes}}" onChange="{{on.rSaidNotes}}" placeholder="What came up…"></textarea></label>
<button class="{{said.cls}}" style="align-self: flex-start" onClick="{{said.toggle}}">{{said.label}}</button>
</section>

<section class="step">
<div class="stephead"><span class="{{done.r2}}">3</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 2</span><h2 class="steptitle">Cross the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1920 1032" aria-hidden="true"><ellipse cx="1400" cy="690" rx="250" ry="270" fill="none" stroke="#F1F9A6" stroke-width="11" stroke-linecap="round" transform="rotate(-6 1400 690)"></ellipse><ellipse cx="1406" cy="686" rx="260" ry="264" fill="none" stroke="#F1F9A6" stroke-width="6" stroke-dasharray="44 26" transform="rotate(4 1400 690)" opacity=".85"></ellipse><rect x="1230" y="945" width="340" height="76" rx="38" fill="#F1F9A6" stroke="#1F1412" stroke-width="4"></rect><text x="1400" y="983" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="44" fill="#1F1412">YOU’RE HERE</text></svg></figure>
<p class="hint">Physically move to where they were standing. Step into their model of the world, into their shoes. You are now them. Answer as if you are them.</p>
<ul class="prompts"><li>What was happening in your (their) life?</li><li>What were you (they) afraid of?</li><li>What resources didn’t you (they) have?</li><li>What pain were you (they) carrying?</li><li>What were you (they) trying to achieve?</li><li>What did you (they) need?</li></ul>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">Optional notes</span><textarea class="field" style="min-height: 84px" value="{{v.rCrossNotes}}" onChange="{{on.rCrossNotes}}" placeholder="As them, I noticed…"></textarea></label>
<button class="{{crossed.cls}}" style="align-self: flex-start" onClick="{{crossed.toggle}}">{{crossed.label}}</button>
</section>

<section class="step">
<div class="stephead"><span class="{{done.r3}}">4</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 3</span><h2 class="steptitle">Stand in the middle of the bridge</h2></div></div>
<figure class="pic"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1920 1032" aria-hidden="true"><ellipse cx="980" cy="290" rx="250" ry="250" fill="none" stroke="#F1F9A6" stroke-width="11" stroke-linecap="round" transform="rotate(-6 980 290)"></ellipse><ellipse cx="986" cy="286" rx="260" ry="244" fill="none" stroke="#F1F9A6" stroke-width="6" stroke-dasharray="44 26" transform="rotate(4 980 290)" opacity=".85"></ellipse><rect x="1260" y="240" width="340" height="76" rx="38" fill="#F1F9A6" stroke="#1F1412" stroke-width="4"></rect><text x="1430" y="278" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="44" fill="#1F1412">YOU’RE HERE</text></svg></figure>
<p class="hint">Move to a third spot where you can see both where you stood as yourself and where they stood. Become someone who loves you both, or a kind bystander who wants the best for you both. It can be me (Sav) if you need someone to imagine.</p>
<ul class="prompts"><li>What do you see that they cannot?</li><li>What do both people need?</li><li>What can each person learn?</li><li>What wisdom lives here?</li></ul>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #6A5A57">Optional notes</span><textarea class="field lime" style="min-height: 84px" value="{{v.rMiddleNotes}}" onChange="{{on.rMiddleNotes}}" placeholder="From the middle, I can see…"></textarea></label>
<button class="{{middle.cls}}" style="align-self: flex-start" onClick="{{middle.toggle}}">{{middle.label}}</button>
</section>

<section class="step">
<div class="stephead"><span class="{{done.r4}}">5</span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Step 4</span><h2 class="steptitle">Put it down</h2></div></div>
<figure class="pic"><img src="/tools/assets/03a1b71b1a1f702415ce3062b36b4132.jpg" alt="Three people seen from above standing at the points of a triangle: A is you, B is them, C is the observer"><svg class="ring" viewBox="0 0 1920 1032" aria-hidden="true"><ellipse cx="500" cy="690" rx="220" ry="250" fill="none" stroke="#F1F9A6" stroke-width="11" stroke-linecap="round" transform="rotate(-6 500 690)"></ellipse><ellipse cx="506" cy="686" rx="230" ry="244" fill="none" stroke="#F1F9A6" stroke-width="6" stroke-dasharray="44 26" transform="rotate(4 500 690)" opacity=".85"></ellipse><rect x="330" y="940" width="340" height="76" rx="38" fill="#F1F9A6" stroke="#1F1412" stroke-width="4"></rect><text x="500" y="978" text-anchor="middle" dominant-baseline="central" font-family="'Patrick Hand SC', cursive" font-size="44" fill="#1F1412">BACK TO YOU</text></svg></figure>
<p class="hint">Place your hand on your chest. Take a slow breath. Then say each one out loud, and tap it once you have.</p>
<div style="display: flex; flex-direction: column; gap: 10px"><sc-for list="{{putSays}}" as="p" hint-placeholder-count="4"><button class="{{p.cls}}" aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}"><span class="tick"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{p.label}}</button></sc-for></div>
<div class="q"><span class="qtext">Now move it through your body. Whatever feels right.</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{moveChips}}" as="c" hint-placeholder-count="7"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F1F9A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>{{c.label}}</button></sc-for></div></div>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 20px; line-height: 1.4; color: #4E0C08">The bridge has been crossed. You don’t have to keep standing at the beginning of it.</p>
<button class="{{releaseDoneCls}}" style="align-self: flex-start" onClick="{{finishRelease}}">{{releaseDoneLabel}}</button>

<section class="step" style="background: #FBE6FC; border-color: #F4C2F7">
<div class="stephead"><span class="stepnum" style="background: #FFFFFF; color: #4E0C08; box-shadow: inset 0 0 0 1.5px #4E0C08"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F4C2F7" stroke="#4E0C08" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.9 0 5.9 4.1 4.4 7.4C19.5 16.4 12 21 12 21z"></path></svg></span><div style="display: flex; flex-direction: column"><span class="hand" style="font-size: 16px; color: #A8231F">Aftercare</span><h2 class="steptitle">Let your nervous system settle</h2></div></div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #463A38">Don’t jump straight back into work, emails or housework. Think of this like cleaning out an emotional cupboard: things can feel messier before they feel lighter. Pick your aftercare.</p>

<p style="margin: 0; font-size: 15px; font-weight: 600">Be gentle with yourself. You’ve just done important work.</p>
</section>
</sc-if>

<section class="dark" style="position: relative; overflow: hidden; padding: 32px 28px; display: flex; flex-direction: column; gap: 12px">
<svg width="120" height="120" viewBox="0 0 24 24" fill="#F4C2F7" aria-hidden="true" style="position: absolute; right: -18px; top: -18px; opacity: .25"><path d="M12 1C12.7 7.3 16.7 11.3 23 12C16.7 12.7 12.7 16.7 12 23C11.3 16.7 7.3 12.7 1 12C7.3 11.3 11.3 7.3 12 1Z"></path></svg>
<div class="hand" style="font-size: 17px; color: #F1F9A6">A final reminder</div>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(28px, 4.6vw, 40px); line-height: 1.08">The goal is understanding. The goal is release.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.65; color: #F6D6CF">This isn’t about excusing behaviour. It isn’t about forcing forgiveness, or reconnecting with someone. It’s about building a bridge between where you’ve been and where you want to go.</p>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 22px; color: #F1F9A6">Take the lesson. Leave the pain. Keep moving forward.</p>
</section>
